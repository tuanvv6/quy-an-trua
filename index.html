<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quỹ ăn trưa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3EE; --surface:#FFFFFF; --surface-2:#FAF9F6; --ink:#1E2125; --ink-2:#4A4F57; --muted:#7A7F87;
  --line:#E5E1D8; --line-2:#EFEBE3; --accent:#2E4A7A; --accent-soft:#C9D3E5; --accent-bg:#EEF1F7;
  --chip:#F0EDE6; --shadow:0 1px 2px rgba(30,33,37,.05),0 4px 16px rgba(30,33,37,.05);
  --nav-h:64px; --radius:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171A; --surface:#1D2024; --surface-2:#22262B; --ink:#ECEDEE; --ink-2:#C2C6CC; --muted:#8D939B;
    --line:#2E3238; --line-2:#272B30; --accent:#9DB3DA; --accent-soft:#3A4B68; --accent-bg:#232B38;
    --chip:#2A2E34; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15171A; --surface:#1D2024; --surface-2:#22262B; --ink:#ECEDEE; --ink-2:#C2C6CC; --muted:#8D939B;
  --line:#2E3238; --line-2:#272B30; --accent:#9DB3DA; --accent-soft:#3A4B68; --accent-bg:#232B38;
  --chip:#2A2E34; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}

/* Header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;flex:1;min-width:0}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.period{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface);height:38px}
.period button{border:0;background:none;width:36px;height:36px;border-radius:999px;display:grid;place-items:center;color:var(--ink-2)}
.period button:disabled{opacity:.3;cursor:default}
.period select{border:0;background:none;font-weight:600;font-size:14px;appearance:none;-webkit-appearance:none;padding:0 2px;text-align:center;min-width:76px}
.notice{font-size:12px;color:var(--ink-2);background:var(--chip);border-radius:8px;padding:8px 10px;margin:12px 0 0;display:flex;gap:8px;align-items:flex-start}
.notice b{font-weight:600}
.notice button{margin-left:auto;border:0;background:none;color:var(--accent);font-weight:600;font-size:12px;white-space:nowrap;padding:0}

/* Sections */
h1{font-size:20px;margin:20px 0 4px;letter-spacing:-.01em}
h2{font-size:15px;margin:0;font-weight:600}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin:14px 0;box-shadow:var(--shadow)}
.sec-h{display:flex;align-items:baseline;gap:8px;padding:14px 16px 10px}
.sec-h .sub{color:var(--muted);font-size:12.5px}
.sec-h .link{margin-left:auto;font-size:13px;color:var(--accent);font-weight:600;background:none;border:0;padding:0}
.sec-b{padding:0 16px 16px}
.hint{color:var(--muted);font-size:12.5px;margin:8px 0 0}

/* Summary stats */
.qs{list-style:none;margin:0;padding:0 16px 10px}
.qs li{display:flex;align-items:center;gap:8px;min-height:32px;font-size:13.5px;border-bottom:1px dashed var(--line)}
.qs li:nth-last-child(2){border-bottom:0}
.qs li:last-child{border-bottom:0;border-top:1px solid var(--ink-2);font-weight:600;margin-top:2px}
.qs .op{width:14px;color:var(--muted);font-weight:600;flex:none}
.qs .k{color:var(--ink-2);flex:1;min-width:0}
.qs li:last-child .k{color:var(--ink)}
.qs .v{font-weight:600}
.qs button{border:0;background:none;padding:0;color:var(--accent);font-size:12.5px;font-weight:500}
@media (min-width:760px){
  .qs{display:flex;padding:0;border-top:1px solid var(--line-2)}
  .qs li{flex:1;flex-direction:column;align-items:flex-start;gap:0;padding:10px 14px;border:0;border-right:1px solid var(--line-2);margin:0!important;position:relative}
  .qs li:last-child{border-top:0;border-right:0;background:var(--surface-2)}
  .qs .op{position:absolute;left:-7px;top:50%;transform:translateY(-50%);background:var(--surface);width:14px;text-align:center;line-height:14px}
  .qs li:first-child .op{display:none}
  .qs .k{font-size:12px;color:var(--muted)}
  .qs .v{font-size:16px}
}

.fund-sum{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:12px 16px;border-radius:var(--radius)}
.fund-sum:hover{background:var(--surface-2)}
.fs-k{flex:1;min-width:0;font-weight:600;font-size:14.5px}
.fs-k small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.fs-v{font-size:18px;font-weight:700;letter-spacing:-.01em}
.chev{color:var(--muted);transition:transform .15s;flex:none}
.fund-sum[aria-expanded="true"] .chev{transform:rotate(180deg)}
.fund-sum[aria-expanded="true"]{border-radius:var(--radius) var(--radius) 0 0}
#fundDetail .qs{border-top:1px solid var(--line-2);padding-top:4px}
@media (min-width:760px){#fundDetail .qs{padding-top:0}}
.mini-ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.seg.sm{flex:0 0 auto;padding:2px}
.seg.sm button{padding:4px 10px;font-size:12px;flex:0 0 auto}
.hbar .cnt{display:block;font-size:11px;color:var(--muted)}

.gst{display:block;font-size:10.5px;color:var(--muted);font-weight:400}
.mstats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line-2);border-top:1px solid var(--line-2);margin-top:6px}
.mstats>div{background:var(--surface);padding:10px 16px;display:flex;flex-direction:column}
.mstats span{font-size:11.5px;color:var(--muted)}
.mstats b{font-size:16px}
.mstats small{font-size:11px;color:var(--muted)}
@media (max-width:420px){.mstats>div{padding:10px 12px}}

.lg{display:inline-block;vertical-align:middle;margin:0 4px 0 8px}
.lg.bar{width:10px;height:10px;border-radius:2px;background:var(--accent)}
.lg.line{width:14px;height:0;border-top:2px solid var(--ink)}

/* Random */
.icon-btn{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:999px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.eat{display:flex;align-items:center;gap:12px;padding:12px 16px}
.eat .t{flex:1;min-width:0}
.eat .t b{display:block;font-size:16px;line-height:1.3}
.eat .t span{display:block}
.eat-b{display:flex;gap:8px;flex:none}
@media (max-width:480px){.eat{flex-wrap:wrap}.eat-b{width:100%}.eat-b .btn{flex:1}}
.eat .t span{font-size:12.5px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:36px;padding:0 14px;font-size:13.5px;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn:disabled{opacity:.4;cursor:default}
.pick{margin:4px 16px 0;border:1px solid var(--line);border-radius:12px;padding:18px 16px;text-align:center;background:var(--surface-2)}
.pick .lbl{font-size:12px;color:var(--muted);font-weight:500}
.pick .nm{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px;min-height:39px}
.pick .nm.rolling{color:var(--muted)}
.pick .meta{font-size:12.5px;color:var(--ink-2)}
.pick .why{font-size:12px;color:var(--muted);margin-top:6px}
.acts{display:flex;gap:8px;justify-content:center;padding:14px 16px 4px;flex-wrap:wrap}
.rlabel{font-size:12px;color:var(--muted);font-weight:600;padding:14px 16px 6px;display:flex;justify-content:space-between;align-items:center}
.rlabel button{border:0;background:none;color:var(--accent);font-size:12px;font-weight:600;padding:0 0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent-bg);border-color:var(--accent);color:var(--ink);font-weight:500}
.chip small{color:var(--muted);font-size:11px;margin-left:3px}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);padding:10px 16px 0}
.wx{margin:0 16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
.wx-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--chip);color:var(--ink-2)}
.wx-ic.sm{width:40px;height:40px;border-radius:10px}
.wx-rain .wx-ic,.wx-ic.wx-rain,.wx-storm .wx-ic,.wx-ic.wx-storm{background:var(--accent-bg);color:var(--accent)}
.wx-hot .wx-ic,.wx-ic.wx-hot{background:#F6E7D3;color:#9A5B13}
:root[data-theme="dark"] .wx-hot .wx-ic,:root[data-theme="dark"] .wx-ic.wx-hot{background:#3A2E20;color:#E2B47A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wx-hot .wx-ic,:root:not([data-theme="light"]) .wx-ic.wx-hot{background:#3A2E20;color:#E2B47A}}
.wx-head{display:flex;gap:12px;align-items:center}
.wx-b{min-width:0;flex:1}
.wx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:10px;overflow:hidden;margin-top:12px}
.wx-grid>div{background:var(--surface);padding:8px 10px;min-width:0}
.wx-grid .k{display:block;font-size:11px;color:var(--muted)}
.wx-grid b{font-size:16px}
.wx-grid small{display:block;font-size:11px;color:var(--ink-2);line-height:1.3}
@media (max-width:420px){.wx-grid{grid-template-columns:1fr 1fr}}
.wx-hours{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.wx-hours>div{display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid var(--line-2);border-radius:10px;padding:6px 4px;background:var(--surface);font-size:12px;color:var(--ink-2)}
.wx-hours b{font-size:15px;color:var(--ink)}
.wx-hours small{font-size:11px;color:var(--muted)}
.wx-adv{list-style:none;margin:10px 0 0;padding:0;font-size:12.5px;font-weight:500}
.wx-adv li::before{content:"→ ";color:var(--muted)}
.wx-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wx-t b{font-size:20px;letter-spacing:-.01em}
.wx-badge{font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:1px 8px;background:var(--surface)}
.wx-d{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.wx-a{font-size:12.5px;color:var(--ink);font-weight:500;margin-top:2px}
.wx-src{font-size:11px;color:var(--muted);padding:6px 16px 10px}
.wx-mini{display:flex;gap:8px;align-items:center;margin:0 16px 10px;font-size:12.5px;color:var(--ink-2)}
.reasons{list-style:none;margin:10px 0 0;padding:10px 0 0;border-top:1px dashed var(--line);text-align:left;font-size:12.5px;color:var(--ink-2)}
.reasons li{padding-left:14px;position:relative;margin:2px 0}
.reasons li::before{content:"";position:absolute;left:3px;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--muted)}
.chip.far{opacity:.55}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}

/* Table */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line-2)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line-2);white-space:nowrap}
th{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface-2);line-height:1.3;vertical-align:bottom}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;border-right:1px solid var(--line-2)}
th:first-child{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;background:var(--surface-2);border-top:1px solid var(--line);border-bottom:0}
tfoot td:first-child{background:var(--surface-2)}
td .name{border:0;background:none;padding:0;font-weight:500;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
td .name:hover{text-decoration-color:var(--accent);color:var(--accent)}
td.dim{color:var(--muted)}
.tag{display:inline-block;font-size:10.5px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}
.formula{font-size:12px;color:var(--muted);padding:10px 16px 14px;border-top:1px solid var(--line-2)}
.formula code{font-family:inherit;color:var(--ink-2);background:var(--chip);padding:1px 6px;border-radius:4px}

/* Tabs (segmented) */
.seg{display:flex;gap:4px;background:var(--chip);border-radius:10px;padding:3px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:none;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* Chart */
.chart{margin-top:12px;touch-action:pan-y}
.chart svg{width:100%;height:auto;display:block}
.chart .cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;gap:8px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink-2)}
.hbar{display:grid;grid-template-columns:minmax(90px,140px) 1fr auto;gap:6px 10px;align-items:center;font-size:13px;margin-top:12px}
.hbar .bar{height:10px;border-radius:3px;background:var(--accent-soft);position:relative}
.hbar .bar span{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--accent)}
.hbar .val{text-align:right;color:var(--ink-2)}

/* Meal list */
.list{list-style:none;margin:0;padding:0}
.meal{border-top:1px solid var(--line-2)}
.meal>button{display:grid;grid-template-columns:52px 1fr auto;gap:2px 12px;width:100%;text-align:left;background:none;border:0;padding:12px 16px}
.meal>button:hover{background:var(--surface-2)}
.d{grid-row:span 3;text-align:center;border:1px solid var(--line);border-radius:8px;padding:4px 0;align-self:start;line-height:1.15}
.d b{display:block;font-size:17px}
.d small{font-size:10.5px;color:var(--muted)}
.meal .r{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meal .t{text-align:right;font-weight:600}
.meal .m2{grid-column:2/4;font-size:12.5px;color:var(--ink-2)}
.meal .m3{grid-column:2/4;font-size:12.5px;color:var(--muted);line-height:1.45}
.meal .m3 .g{color:var(--ink-2)}
.group-h{padding:10px 16px 6px;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2);border-top:1px solid var(--line-2);display:flex;justify-content:space-between}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* Filters */
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px 14px}
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.f select,.f input{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;font-size:14px;min-width:0;width:100%}
.f.wide{grid-column:1/-1}
.search{position:relative}
.search input{padding-left:34px}
.search svg{position:absolute;left:10px;bottom:11px;color:var(--muted)}
@media (max-width:640px){.filters{grid-template-columns:1fr 1fr}}
.fbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 16px 12px}
.result{font-size:13px;color:var(--ink-2)}
.result b{color:var(--ink)}
.clear{margin-left:auto;border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:0}

/* Member */
.picker{padding:16px}
.picker select{height:48px;font-size:16px;font-weight:500}
.ledger{margin:0;padding:0 16px 6px;list-style:none}
.ledger li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ledger li:last-child{border-bottom:0;border-top:1px solid var(--ink-2);font-weight:600;margin-top:2px}
.ledger .op{display:inline-block;width:16px;color:var(--muted);font-weight:600}
.ledger span:first-child{color:var(--ink-2)}
.ledger li:last-child span:first-child{color:var(--ink)}
.mrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 16px;border-top:1px solid var(--line-2);font-size:13.5px}
.mrow .sm{font-size:12px;color:var(--muted)}
.mrow button.lk{border:0;background:none;padding:0;text-align:left;font-weight:500;color:var(--ink)}
.mrow button.lk:hover{color:var(--accent)}

/* Payments */
.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.badge.dep{background:var(--chip);color:var(--ink-2)}
.badge.adv{border:1px solid var(--accent);color:var(--accent)}
.explain{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 14px;font-size:12.5px;color:var(--ink-2)}
.explain>div{background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:10px}
.explain b{display:block;color:var(--ink);margin-bottom:2px}
@media (max-width:520px){.explain{grid-template-columns:1fr}}
.tx-link{border:0;background:none;padding:0;color:var(--accent);font-size:12px;font-weight:500;text-align:left}

/* Bottom nav */
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bn .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h);padding:0}
nav.bn button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--muted)}
nav.bn button[aria-current="page"]{color:var(--ink);font-weight:600}
nav.bn button[aria-current="page"] svg{color:var(--accent)}

/* Sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(15,17,20,.42);display:none;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:6px 0 calc(16px + env(safe-area-inset-bottom));animation:up .18s ease-out}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:16px;max-height:84vh}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 6px}
.sh-h{display:flex;align-items:flex-start;gap:12px;padding:8px 16px 12px}
.sh-h h3{margin:0;font-size:18px;letter-spacing:-.01em}
.sh-h .sub{font-size:13px;color:var(--muted)}
.x{margin-left:auto;border:0;background:var(--chip);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.kv{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.kv>div{padding:10px 16px;border-right:1px solid var(--line-2)}

.kv .v{font-weight:600}
.payers{padding:12px 16px;font-size:13.5px;border-bottom:1px solid var(--line-2)}

.payers>div:not(.k){display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.note{margin:12px 16px 0;font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:10px}
.issues{list-style:none;margin:0;padding:0 16px}
.issues li{padding:10px 0;border-top:1px solid var(--line-2);font-size:13.5px;color:var(--ink-2)}
.issues li small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:2px}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:24px 0 8px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}


/* ================= v5 — Sổ quỹ: restrained, ledger-like ================= */
:root{
  --bg:#F4F5F6; --surface:#FFFFFF; --surface-2:#F9FAFA; --ink:#1C2024; --ink-2:#4B5259; --muted:#7E848B;
  --line:#E2E4E7; --line-2:#ECEEF0; --accent:#0E6B6B; --accent-soft:#BFD8D7; --accent-bg:#EEF5F4; --chip:#F0F1F2;
  --radius:12px; --shadow:none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111315; --surface:#181B1E; --surface-2:#1D2024; --ink:#E9EBED; --ink-2:#B4BAC0; --muted:#868D94;
    --line:#2A2E33; --line-2:#23272B; --accent:#5FB3AE; --accent-soft:#24413F; --accent-bg:#1A2B2A; --chip:#202428;
  }
}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#181B1E; --surface-2:#1D2024; --ink:#E9EBED; --ink-2:#B4BAC0; --muted:#868D94;
  --line:#2A2E33; --line-2:#23272B; --accent:#5FB3AE; --accent-soft:#24413F; --accent-bg:#1A2B2A; --chip:#202428;
}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;background:var(--bg);
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 20px)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.wrap{max-width:1080px}

/* Header */
.top{background:var(--surface);border-bottom:1px solid var(--line);backdrop-filter:none}
.top .wrap{min-height:56px;gap:10px}
.brand{font-size:16px;font-weight:600;letter-spacing:-.005em;display:flex;align-items:center;gap:8px}
.brand-mark{display:none}
.brand-txt small{display:none}
.brand::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--accent);flex:none}
.period{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.period button{width:32px;height:34px;border-radius:6px}
.period select{font-size:14px;font-weight:600;min-width:72px}
.icon-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line)}
.notice{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;margin:0;padding:10px 0;font-size:12.5px;color:var(--muted)}
.notice b{color:var(--ink-2);font-weight:600}
.notice button{color:var(--accent);font-size:12.5px}

/* Type */
h1{font-size:22px;font-weight:600;letter-spacing:-.015em;margin:22px 0 14px;line-height:1.25}
h1 .h1-sub{display:block;font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0;margin-top:2px}
h2{font-size:14.5px;font-weight:600;letter-spacing:0}

/* Panels: flat, hairline */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:none;margin:0 0 14px;overflow:hidden}
.sec-h{padding:14px 16px 10px;background:none;border:0;align-items:baseline}
.sec-h .sub{font-size:12.5px;color:var(--muted);margin-left:auto}
.sec-h .link{margin-left:12px}
.sec-h .link,.clear,.rlabel button,.tx-link{color:var(--accent);font-weight:500}
.sec-b{padding:0 16px 16px}

/* Overview grid */
.ov-grid{display:flex;flex-direction:column}
.col-side,.col-main{display:contents}
.ov-grid #fundSec{order:0}.ov-grid #eatCard{order:1}.ov-grid .col-main>*:not(#fundSec){order:2}.ov-grid .recent-sec{order:3}
@media (min-width:1024px){
  .ov-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
  .col-side,.col-main{display:block;min-width:0}
  .col-side{grid-column:2;grid-row:1;position:sticky;top:76px}
  .col-main{grid-column:1;grid-row:1}
}

/* Fund: balance header, no box */
#fundSec{background:none;border:0;border-radius:0;overflow:visible;margin-bottom:16px}
.fund-sum{display:grid;grid-template-columns:1fr auto;grid-template-areas:"k chev" "v chev";align-items:end;padding:0;border-radius:0;background:none;text-align:left;width:100%;border:0}
.fund-sum:hover{background:none}
.fs-k{grid-area:k;font-size:13px;font-weight:500;color:var(--muted)}
.fs-k small{display:inline;font-size:13px;color:var(--muted)}
.fs-k small::before{content:" — "}
.fs-v{grid-area:v;font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.15;color:var(--ink)}
.chev{grid-area:chev;align-self:center;width:32px;height:32px;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--surface);box-sizing:border-box}
#fundDetail{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
#fundDetail .qs{border:0;padding:4px 16px 8px}
.qs li{min-height:38px;border-bottom:1px solid var(--line-2)}
.qs li:last-child{border-top:1px solid var(--ink);border-bottom:0}
@media (min-width:760px){
  #fundDetail .qs{display:flex;padding:0}
  .qs li{border:0;border-right:1px solid var(--line-2)}
  .qs li:last-child{border-top:0;background:var(--surface-2)}
  .qs .op{background:var(--surface)}
}

/* Suggestion: quiet row */
#eatCard{background:var(--surface);border:1px solid var(--line);color:var(--ink);box-shadow:none}
#eatCard::after{display:none}
#eatCard .eat{padding:14px 16px;gap:12px;align-items:center;flex-wrap:wrap}
#eatCard .wx-ic{width:40px;height:40px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);align-self:center}
#eatCard .t span{font-size:12.5px;color:var(--muted)}
#eatCard .t span:first-child{font-size:12.5px;color:var(--accent);font-weight:500}
#eatCard .t b{font-size:18px;font-weight:600;letter-spacing:-.01em;margin:1px 0 2px;color:var(--ink)}
#eatCard .eat-b{gap:8px}
#eatCard .btn{height:34px;font-size:13px;font-weight:500;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
#eatCard .btn.pri{background:var(--ink);border-color:var(--ink);color:var(--surface)}
@media (max-width:480px){#eatCard .eat-b{width:100%}#eatCard .eat-b .btn{flex:1}}

/* Table */
.tbl-wrap{border-top:1px solid var(--line-2)}
th{background:var(--surface);color:var(--muted);font-weight:500;font-size:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
th:first-child{background:var(--surface)}
td{padding:10px 14px;font-size:14px}
th:first-child,td:first-child{border-right:0;box-shadow:inset -1px 0 0 var(--line-2)}
tbody tr:hover td{background:var(--surface-2)}
td .name{text-decoration:none;font-weight:500;color:var(--ink)}
td .name:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
tfoot td,tfoot td:first-child{background:var(--surface);font-weight:600;border-top:1px solid var(--ink)}
.tag{border-color:var(--line);color:var(--muted);font-weight:500;border-radius:4px}
.formula{background:none;border-top:1px solid var(--line-2);padding:10px 16px 12px}
.formula code{background:var(--chip);border:0}

/* Segmented control: underline tabs */
.seg{background:none;border-radius:0;padding:0;gap:18px;border-bottom:1px solid var(--line)}
.seg button{flex:0 0 auto;border-radius:0;padding:8px 0;font-size:13.5px;font-weight:500;color:var(--muted);box-shadow:none;margin-bottom:-1px;border-bottom:2px solid transparent}
.seg button[aria-selected="true"]{background:none;color:var(--ink);box-shadow:none;border-bottom-color:var(--ink)}
.seg.sm{gap:4px;border:1px solid var(--line);border-radius:8px;padding:2px}
.seg.sm button{border:0;margin:0;padding:4px 10px;border-radius:6px;font-size:12px}
.seg.sm button[aria-selected="true"]{background:var(--chip)}
.sec-h:has(.seg){padding-bottom:0}
.dots{display:none}

/* Charts: graphite, active month in accent */
.chart svg rect[fill="var(--accent-soft)"]{fill:#D5D9DD}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chart svg rect[fill="var(--accent-soft)"]{fill:#33383D}}
.hbar .bar{background:var(--chip);height:8px}
.hbar .bar span{background:var(--accent)}

/* Lists */
.meal>button{padding:12px 16px;grid-template-columns:44px 1fr auto}
.d{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:4px 0}
.d b{font-size:17px;font-weight:600}
.d small{color:var(--muted);opacity:1}
.meal .r{font-weight:600}
.meal .t{font-weight:600}
.group-h{background:var(--surface-2);color:var(--muted);font-weight:500;padding:8px 16px;border-top:1px solid var(--line-2)}
.mrow{padding:11px 16px}
.badge{border-radius:4px;font-weight:500}
.badge.dep{background:var(--chip);color:var(--ink-2)}
.badge.adv{background:none;border:1px solid var(--accent-soft);color:var(--accent)}
.explain>div{background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px}
.f select,.f input{height:40px;border-radius:8px;background:var(--surface);border-color:var(--line)}
.btn{height:36px;border-radius:8px;font-weight:500}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip{border-radius:6px;padding:5px 10px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:500}
.chip[aria-pressed="true"] small{color:color-mix(in srgb,var(--surface) 70%,transparent)}
.picker select{height:44px;border-radius:8px;font-size:15px}
.mstats{background:var(--line-2)}
.mstats>div{background:var(--surface)}
.mstats b{font-size:18px;font-weight:600;color:var(--ink)}
.ledger li:last-child{border-top:1px solid var(--ink)}

/* Sheet */
.ov{background:rgba(17,19,21,.4)}
.sheet{border-radius:14px 14px 0 0}
@media (min-width:700px){.sheet{border-radius:14px}}
.sh-h h3{font-size:18px;font-weight:600;letter-spacing:-.01em}
.x{background:none;border:1px solid var(--line);border-radius:8px}
.pick{background:var(--surface-2);border:1px solid var(--line);border-radius:10px}
.pick .nm{font-size:26px;font-weight:600;letter-spacing:-.015em}
.pick .lbl{color:var(--accent);font-weight:500}
.wx{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.wx-ic{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;color:var(--ink-2)}
.wx-hot .wx-ic,.wx-ic.wx-hot,.wx-rain .wx-ic,.wx-ic.wx-rain,.wx-storm .wx-ic,.wx-ic.wx-storm{background:var(--surface-2);color:var(--ink-2)}
.wx-t b{font-size:22px;font-weight:600}
.wx-badge{border-radius:4px;font-weight:500}
.wx-grid{border-radius:8px}
.wx-grid b{font-weight:600}
.wx-hours>div{border-radius:8px}

/* Bottom nav: flat bar */
nav.bn{left:0;right:0;bottom:0;border:0;border-top:1px solid var(--line);border-radius:0;background:var(--surface);box-shadow:none}
nav.bn .wrap{height:var(--nav-h);padding:0}
nav.bn button{font-size:11.5px;font-weight:500;color:var(--muted);border-radius:0;margin:0;position:relative}
nav.bn button[aria-current="page"]{color:var(--ink);background:none}
nav.bn button[aria-current="page"] svg{color:var(--accent)}
nav.bn button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;background:var(--ink)}

/* Desktop: tabs move into the header row */
@media (min-width:1024px){
  body{padding-bottom:24px}
  nav.bn{top:0;bottom:auto;left:50%;right:auto;transform:translateX(-50%);border:0;background:none;z-index:25;width:auto}
  nav.bn .wrap{display:flex;height:56px;gap:4px}
  nav.bn button{flex-direction:row;gap:8px;font-size:14px;padding:0 14px}
  nav.bn button svg{width:18px;height:18px}
  nav.bn button[aria-current="page"]::before{top:auto;bottom:0;left:14px;right:14px}
  h1{font-size:24px;margin-top:26px}
}
@media (max-width:440px){.fs-v{font-size:30px}}
#eatCard .eat-b{width:100%}#eatCard .eat-b .btn{flex:1}
#eatCard .t{min-width:0;flex:1}
.sec-h .link{margin-left:auto}
.sec-h .sub + .link{margin-left:12px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}


/* ================= v7 — Apple-style: SF type, iOS system colours ================= */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface-2:#F7F7FA; --ink:#1C1C1E; --ink-2:#3A3A3C; --muted:#8E8E93;
  --line:#E5E5EA; --line-2:#EFEFF4; --chip:#EFEFF4;
  --blue:#007AFF; --blue-bg:#E8F1FF; --indigo:#5856D6; --orange:#FF9500; --orange-d:#C46A00; --orange-bg:#FFF3E3;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --ink:#F2F2F7; --ink-2:#D1D1D6; --muted:#98989D;
  --line:#38383A; --line-2:#2C2C2E; --chip:#2C2C2E; --blue:#0A84FF; --blue-bg:#0B2342; --indigo:#5E5CE6;
  --orange:#FF9F0A; --orange-d:#FFB340; --orange-bg:#33240D; --purple:#BF5AF2; --purple-bg:#2E1A38;
  --accent:#0A84FF; --accent-soft:#163A66; --accent-bg:#0B2342;}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --ink:#F2F2F7; --ink-2:#D1D1D6; --muted:#98989D;
  --line:#38383A; --line-2:#2C2C2E; --chip:#2C2C2E; --blue:#0A84FF; --blue-bg:#0B2342; --indigo:#5E5CE6;
  --orange:#FF9F0A; --orange-d:#FFB340; --orange-bg:#33240D; --purple:#BF5AF2; --purple-bg:#2E1A38;
  --accent:#0A84FF; --accent-soft:#163A66; --accent-bg:#0B2342;}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em;background:var(--bg)}
h1{font-size:30px;font-weight:700;letter-spacing:-.025em;margin:18px 0 14px}

/* Translucent nav bars */

/* Grouped cards */

/* Fund: wallet-style gradient card */

/* Lists */

.meal{border-top:.5px solid var(--line)}

.badge.dep{background:var(--blue-bg);color:var(--blue)}

.explain>div:last-child{background:var(--purple-bg);border:0}

.btn.pri{background:var(--blue);color:#fff}
.chip{border:0;background:var(--chip);border-radius:999px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--blue);color:#fff}
.mstats{background:var(--line-2)}
.mstats b{color:var(--blue);font-weight:700}

/* Sheet */

.pick .lbl{color:var(--orange-d)}

/* Tab bar */
nav.bn{background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line)}

  nav.bn button[aria-current="page"]{background:var(--chip);color:var(--ink)}

  h1{font-size:34px}
}

/* ================= v8 — refined neutrals, iris accent, meal-ticket suggestion ================= */
:root{
  --bg:#F6F6F8; --surface:#FFFFFF; --surface-2:#F9F9FB; --ink:#18181B; --ink-2:#3F3F46; --muted:#8B8B94;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --blue:#8D8DF2; --blue-bg:#1E1E3A; --orange:#FF8B3E; --orange-d:#FFA466; --orange-bg:#2E1C10; --purple:#B57FE6; --purple-bg:#26193A;

:root[data-theme="dark"]{

  --blue:#8D8DF2; --blue-bg:#1E1E3A; --orange:#FF8B3E; --orange-d:#FFA466; --orange-bg:#2E1C10; --purple:#B57FE6; --purple-bg:#26193A;
  --accent:#8D8DF2; --accent-soft:#2E2E58; --accent-bg:#1E1E3A;}
.brand::before{background:conic-gradient(from 200deg,#5B5BD6,#8E4EC6,#F76B15,#5B5BD6);border-radius:50%;width:20px;height:20px}
.sec{border:1px solid var(--line)}
td .name{color:var(--ink)}
td .name:hover{color:var(--blue)}

/* Fund: quiet white card, number carries it */
#fundSec{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:18px;padding:18px}
#fundSec .fs-k,#fundSec .fs-k small{color:var(--muted)}

/* ===== Meal ticket ===== */
#eatCard.tk{--o1:#FFC53D;--o2:#F76B15;display:flex;align-items:stretch;padding:0;border:1px solid var(--line);border-radius:18px;
  background:var(--surface);overflow:visible;position:relative;box-shadow:none;color:var(--ink)}
.tk-rain,.tk-storm{--o1:#7FA8F5 !important;--o2:#3E63DD !important}
.tk-hot{--o1:#FFB224 !important;--o2:#E5484D !important}
.tk-cold{--o1:#7EE0EE !important;--o2:#0090FF !important}
.tk-dust,.tk-dust2{--o1:#C4B8E0 !important;--o2:#7C66DC !important}
.tk-humid{--o1:#7CE2D2 !important;--o2:#12A594 !important}
.tk-unknown{--o1:#D4D4D8 !important;--o2:#A1A1AA !important}
.tk-main{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:14px 14px 14px 14px;border:0;background:none;text-align:left;color:inherit;border-radius:18px 0 0 18px}

  background:radial-gradient(circle at 32% 28%,var(--o1),var(--o2) 78%);box-shadow:0 6px 16px -6px var(--o2)}
.tk-orb::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px dashed color-mix(in srgb,var(--o2) 45%,transparent)}

@media (prefers-reduced-motion: no-preference){.tk-orb::after{animation:tkSpin 24s linear infinite}}
@keyframes tkSpin{to{transform:rotate(360deg)}}
.tk-body{display:flex;flex-direction:column;min-width:0;gap:1px}
.tk-lbl{font-size:12px;color:var(--muted);font-weight:500}
.tk-dish{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-size:12px;color:var(--ink-2);margin-top:4px}

.tk-walk i{position:absolute;inset:0 auto 0 0;border-radius:2px;background:linear-gradient(90deg,var(--o1),var(--o2))}

.tk-wx{flex-basis:100%}
/* perforated stub */
.tk-stub{position:relative;flex:none;width:72px;border:0;border-left:1.5px dashed var(--line);background:none;color:var(--o2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:0 18px 18px 0}
.tk-stub small{font-size:11.5px;font-weight:600;color:var(--ink-2)}
.tk-stub:hover{background:color-mix(in srgb,var(--o2) 8%,transparent)}
.tk-stub::before,.tk-stub::after{content:"";position:absolute;left:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.tk-stub::before{top:-9px;clip-path:inset(50% 0 0 0)}
.tk-stub::after{bottom:-9px;clip-path:inset(0 0 50% 0)}
@media (prefers-reduced-motion: no-preference){.tk-stub:hover svg{transform:rotate(-12deg)}.tk-stub svg{transition:transform .2s}}
.ov-grid #eatCard{margin-bottom:14px}

<script src="config.js"></script>
<script>
/* ================== KẾT NỐI GOOGLE SHEETS ================== */
/* Đường link máy chủ lấy từ file config.js (cùng thư mục). Không cần sửa ở đây. */
const CFG = window.QUY_CONFIG || {};
const API_URL = String(CFG.API_URL || "").trim();
/* ============================================================ */

const CONN = {from: null, time: null, raw: null};
const CACHE_KEY = "quy-an-trua:cache:v1";
const apiReady = () => /^https?:\/\//.test(API_URL);
const tzMonth = () => new Intl.DateTimeFormat("en-CA", {timeZone: "Asia/Ho_Chi_Minh", year: "numeric", month: "2-digit"}).format(new Date()).slice(0, 7);
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };

async function apiGet() {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 20000);
  try {
    const r = await fetch(API_URL + (API_URL.includes("?") ? "&" : "?") + "action=data&t=" + Date.now(), {signal: ctl.signal, redirect: "follow"});
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "Lỗi máy chủ");
    return j;
  } finally { clearTimeout(t); }
}
async function apiPost(body) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 30000);
  try {
    const r = await fetch(API_URL, {method: "POST", body: JSON.stringify(body), signal: ctl.signal, redirect: "follow"});
    return await r.json();
  } finally { clearTimeout(t); }
}

const normP = v => { const s = String(v || ""); if (/^\d{4}-\d{2}/.test(s)) return s.slice(0, 7); const d = new Date(s); return isNaN(d) ? "" : new Intl.DateTimeFormat("en-CA", {timeZone: "Asia/Ho_Chi_Minh", year: "numeric", month: "2-digit"}).format(d).slice(0, 7); };
const normD = v => { const s = String(v || ""); if (!s) return null; if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10); const d = new Date(s); return isNaN(d) ? null : new Intl.DateTimeFormat("en-CA", {timeZone: "Asia/Ho_Chi_Minh"}).format(d); };

/* Dựng dữ liệu cho giao diện từ các bảng trong Google Sheets.
   Số dư đầu kỳ được tính lại: đầu kỳ tháng sau = cuối kỳ tháng trước (làm tròn đồng); quản lý luôn về 0. */
function buildData(raw) {
  const members = (raw.members || []).slice().sort((a, b) => (a.sort ?? 999) - (b.sort ?? 999))
    .map(m => ({id: m.id, name: m.name, manager: !!m.manager, active: !!m.active}));
  const parts = {};
  (raw.meal_parts || []).forEach(p => (parts[p.meal_id] ||= []).push({m: p.member_id, own: +p.own || 0, guest: +p.guest || 0}));
  const txs = (raw.transactions || []).map(t => ({id: t.id, period: normP(t.period), date: normD(t.date), m: t.member_id, type: t.type, amount: +t.amount || 0,
    meal: t.meal_id || null, method: t.method || "", note: t.note || null, src: t.src || "", settle: !!t.settle}));
  const order = Object.fromEntries(members.map((m, i) => [m.id, i]));
  const meals = (raw.meals || []).map(m => {
    const ps = (parts[m.id] || []).sort((a, b) => (order[a.m] ?? 99) - (order[b.m] ?? 99));
    const adv = txs.filter(t => t.type === "advance" && t.meal === m.id).map(t => ({m: t.m, amount: t.amount}));
    const paid = adv.reduce((s, x) => s + x.amount, 0), total = +m.total || 0;
    return {id: m.id, period: normP(m.period), date: normD(m.date), restaurant: m.restaurant || "Không rõ", category: m.category || "Khác", event: !!m.event,
      total, parts: ps, payers: total - paid > 1 ? [{m: "fund", amount: total - paid}, ...adv] : adv, note: m.note || null,
      formulaNote: m.formula_note || null, src: m.src || ""};
  }).filter(m => m.parts.length);

  // Danh sách kỳ: từ tháng có dữ liệu sớm nhất đến tháng hiện tại
  const cur = tzMonth(), ids = [...meals.map(m => m.period), ...txs.map(t => t.period)].filter(Boolean).sort();
  const first = ids[0] || cur, lastP = [ids.at(-1) || cur, cur].sort().at(-1);
  const pids = []; for (let [y, mo] = first.split("-").map(Number), g = 0; g < 600; g++, mo === 12 ? (y++, mo = 1) : mo++) { const id = `${y}-${String(mo).padStart(2, "0")}`; pids.push(id); if (id >= lastP) break; }
  const byP = id => ({ms: meals.filter(m => m.period === id), ts: txs.filter(t => t.period === id)});
  let prev = {};
  const periods = pids.map(id => {
    const {ms, ts} = byP(id), opens = {}, mem = [];
    members.forEach(M => {
      const k = M.id, open = M.manager ? 0 : (prev[k] || 0);
      const dep = ts.filter(t => t.m === k).reduce((s, t) => s + t.amount, 0);
      const cost = ms.reduce((s, m) => { const p = m.parts.find(x => x.m === k); if (!p) return s; const n = m.parts.reduce((a, q) => a + q.own + q.guest, 0); return s + m.total * (p.own + p.guest) / n; }, 0);
      const inP = Math.abs(open) >= 1 || dep || cost || (id >= cur && M.active);
      opens[k] = open; if (inP) mem.push(k);
      prev[k] = Math.round(open + dep - cost);
    });
    return {id, label: `T${+id.slice(5)}/${id.slice(0, 4)}`, opens, members: mem};
  });
  members.forEach(M => { const ps = periods.filter(p => p.members.includes(M.id)).map(p => p.id); M.from = ps[0] || cur; M.to = ps.at(-1) || cur; });

  const restaurants = (raw.restaurants || []).map(r => ({id: r.id, name: r.name || null, dish: r.dish, cat: r.cat || "Khác", lat: r.lat ?? null, lon: r.lon ?? null,
    distanceM: r.distance_m ?? null, sample: !!r.sample_loc, suggest: r.suggest !== false, active: r.active !== false, mapsUrl: r.maps_url || null, sampleLoc: !!r.sample_loc}));
  const issues = (raw.notes || []).map(n => ({period: normP(n.period) || null, text: n.text, resolved: true}));
  return {members, periods, meals, txs, restaurants, issues};
}

/* Các bảng gửi lên máy chủ (đổi tên trường giao diện → tên cột Google Sheets) */
const ROW = {
  meals: m => ({id: m.id, period: m.period, date: m.date || "", restaurant: m.restaurant, category: m.category, event: !!(m.event || m.category === "Sự kiện / Quà"),
    total: m.total, note: m.note || "", formula_note: m.formulaNote || "", src: m.src || "", parts: m.parts.map(p => ({m: p.m, own: p.own, guest: p.guest}))}),
  transactions: t => ({id: t.id, period: t.period, date: t.date || "", member_id: t.m, type: t.type, amount: t.amount, meal_id: t.meal || "", method: t.method || "",
    note: t.note || "", src: t.src || "Nhập tay", settle: !!t.settle}),
  restaurants: r => ({id: r.id, dish: r.dish, name: r.name || "", cat: r.cat, maps_url: r.mapsUrl || "", lat: r.lat ?? "", lon: r.lon ?? "", distance_m: r.distanceM ?? "",
    suggest: !!r.suggest, active: r.active !== false, sample_loc: !!r.sampleLoc}),
  members: (m, i) => ({id: m.id, name: m.name, manager: !!m.manager, active: !!m.active, sort: i + 1}),
};

function bootScreen(html) {
  const v = document.getElementById("view");
  if (v) v.innerHTML = `<div class="boot">${html}</div>`;
}
const BOOT_SPIN = `<div class="boot-spin" aria-hidden="true"></div><b>Đang tải dữ liệu…</b><span>Lấy số liệu mới nhất từ Google Sheets</span>`;

/* Tải dữ liệu: ưu tiên máy chủ; nếu lỗi mạng thì dùng bản đã lưu lần trước trên máy này. */
async function bootData(opts = {}) {
  if (!apiReady()) {
    if (window.DEMO_RAW) { CONN.from = "demo"; CONN.raw = window.DEMO_RAW; return buildData(window.DEMO_RAW); }
    bootScreen(`<b>Chưa kết nối dữ liệu</b><span>Mở file <code>config.js</code>, dán đường link Apps Script (kết thúc bằng <code>/exec</code>) vào <code>API_URL</code>. Xem hướng dẫn, bước 3.</span>`);
    return null;
  }
  bootScreen(BOOT_SPIN);
  try {
    const j = await apiGet();
    CONN.from = "api"; CONN.time = j.time; CONN.raw = j.data;
    lsSet(CACHE_KEY, JSON.stringify({time: j.time, data: j.data}));
    return buildData(j.data);
  } catch (e) {
    const c = opts.admin ? null : JSON.parse(lsGet(CACHE_KEY) || "null");
    if (c) { CONN.from = "cache"; CONN.time = c.time; CONN.raw = c.data; return buildData(c.data); }
    bootScreen(`<b>Không tải được dữ liệu</b><span>Kiểm tra kết nối mạng rồi thử lại. (${String(e.message || e).slice(0, 120)})</span><button onclick="location.reload()">Thử lại</button>`);
    return null;
  }
}
const connLabel = () => CONN.from === "api" ? `Cập nhật lúc ${CONN.time.slice(11, 16)} ${CONN.time.slice(8, 10)}/${CONN.time.slice(5, 7)}`
  : CONN.from === "cache" ? `Mất kết nối · đang xem bản lưu lúc ${CONN.time.slice(11, 16)} ${CONN.time.slice(8, 10)}/${CONN.time.slice(5, 7)}`
  : "Bản xem thử với dữ liệu mẫu, chưa nối Google Sheets";

</script>
<script>
(async () => {

const DATA = await bootData(); if (!DATA) return;
document.getElementById("connNote").textContent = connLabel(); document.getElementById("pChip").hidden = false;

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NF = new Intl.NumberFormat("vi-VN", {maximumFractionDigits:0});
const vnd = n => { const r = Math.round(n || 0); return (r < 0 ? "−" : "") + NF.format(Math.abs(r)); };
const vndU = n => vnd(n) + " đ";
const dash = n => Math.round(n || 0) === 0 ? "—" : vnd(n);
const short = n => { const a = Math.abs(n); if (a >= 1e6) return (n/1e6).toFixed(a >= 1e7 ? 0 : 1).replace(".", ",") + "tr"; if (a >= 1e3) return Math.round(n/1e3) + "k"; return String(Math.round(n)); };
const MEM = Object.fromEntries(DATA.members.map(m => [m.id, m]));
const nm = id => id === "fund" ? "Quỹ chung" : (MEM[id]?.name ?? id);
const sn = id => id === "fund" ? "Quỹ chung" : nm(id).replace(/^A /, "");
const PER = DATA.periods, PIDX = Object.fromEntries(PER.map((p, i) => [p.id, i]));
const plabel = id => PER[PIDX[id]]?.label ?? id;
const DOW = ["CN","T2","T3","T4","T5","T6","T7"];
const fdate = d => d ? `${d.slice(8,10)}/${d.slice(5,7)}/${d.slice(0,4)}` : "Chưa rõ ngày";
const suat = ml => ml.parts.reduce((s, p) => s + p.own + p.guest, 0);
const EVENT_CAT = "Sự kiện / Quà", isEv = m => m.event || m.category === EVENT_CAT;
const unit = ml => ml.total / suat(ml);
const share = (ml, m) => { const p = ml.parts.find(x => x.m === m); return p ? unit(ml) * (p.own + p.guest) : 0; };
const payerText = ml => ml.payers.map(p => sn(p.m)).join(" + ");
const mealById = id => DATA.meals.find(m => m.id === id);
const sortMeals = arr => arr.slice().sort((a, b) => (b.period + (b.date || "")).localeCompare(a.period + (a.date || "")));

function stats(pid, m) {
  const p = PER[PIDX[pid]];
  const open = p.opens[m] ?? 0;
  const tx = DATA.txs.filter(t => t.period === pid && t.m === m);
  const dep = tx.filter(t => t.type === "deposit").reduce((s, t) => s + t.amount, 0);
  const adv = tx.filter(t => t.type === "advance").reduce((s, t) => s + t.amount, 0);
  const meals = DATA.meals.filter(x => x.period === pid && x.parts.some(q => q.m === m));
  const cost = meals.reduce((s, x) => s + share(x, m), 0);
  const ps = meals.map(x => x.parts.find(q => q.m === m)), sOwn = ps.reduce((s, q) => s + q.own, 0), sGuest = ps.reduce((s, q) => s + q.guest, 0);
  const rg = meals.filter(x => !isEv(x)), rgCost = rg.reduce((s, x) => s + share(x, m), 0), rgS = rg.reduce((s, x) => { const q = x.parts.find(q => q.m === m); return s + q.own + q.guest; }, 0);
  return {nMeals: meals.length, sOwn, sGuest, avg: rgS ? rgCost / rgS : 0, open, dep, adv, cost, close: open + dep + adv - cost, meals, tx, inPeriod: p.members.includes(m)};
}
function groupStats(pid) {
  const p = PER[PIDX[pid]];
  const rows = p.members.map(m => ({m, ...stats(pid, m)}));
  const sum = k => rows.reduce((s, r) => s + r[k], 0);
  const meals = DATA.meals.filter(x => x.period === pid);
  return {rows, open: sum("open"), dep: sum("dep"), adv: sum("adv"), cost: meals.reduce((s, x) => s + x.total, 0), close: sum("close"), nMeals: meals.length, suat: meals.reduce((s, x) => s + suat(x), 0)};
}

/* ---------- State ---------- */
const S = {
  tab: "overview", period: PER[PER.length - 1].id, member: "",
  chart: 0, pchart: 5, memberScope: "period", catScope: "period", catBy: "group", fundOpen: false,
  mf: {scope: "period", q: "", member: "", payer: "", cat: "", rest: "", from: "", to: ""},
  tf: {scope: "period", member: "", type: "deposit"},
};
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("tab")) S.tab = h.get("tab");
  if (h.get("p") && PIDX[h.get("p")] !== undefined) S.period = h.get("p");
  if (h.get("m") && MEM[h.get("m")]) S.member = h.get("m");
}
function writeHash() {
  const h = new URLSearchParams({tab: S.tab, p: S.period});
  if (S.tab === "members" && S.member) h.set("m", S.member);
  try { history.replaceState(null, "", "#" + h.toString()); } catch (e) {}
}
function go(tab, patch = {}) {
  S.tab = tab; Object.assign(S, patch);
  render(); window.scrollTo({top: 0});
}

/* ---------- Charts ---------- */
function barSVG(values, labels, active, unitLabel, raw) {
  const W = 640, H = 210, pl = 8, pr = 8, pt = 22, pb = 28;
  const max = Math.max(...values, 1), n = values.length;
  const bw = (W - pl - pr) / n, gap = Math.min(14, bw * .3);
  let g = "";
  [0, .5, 1].forEach(f => { const y = pt + (H - pt - pb) * (1 - f); g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="var(--line-2)" stroke-width="1"/>`; });
  values.forEach((v, i) => {
    const h = (H - pt - pb) * v / max, x = pl + i * bw + gap / 2, y = H - pb - h, on = i === active;
    g += `<rect x="${x}" y="${y}" width="${bw - gap}" height="${Math.max(h, v ? 2 : 0)}" rx="3" fill="${on ? "var(--b-on)" : "var(--b-off)"}"><title>${esc(labels[i])}: ${vndU(v)}</title></rect>`;
    g += `<text x="${x + (bw - gap) / 2}" y="${y - 6}" text-anchor="middle" font-size="11" fill="${on ? "var(--ink)" : "var(--muted)"}" font-weight="${on ? 600 : 400}" class="num">${raw ? v : v ? short(v) : "0"}</text>`;
    g += `<text x="${x + (bw - gap) / 2}" y="${H - 9}" text-anchor="middle" font-size="11" fill="${on ? "var(--ink)" : "var(--muted)"}" font-weight="${on ? 600 : 400}">${esc(labels[i])}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ cột theo tháng, đơn vị ${unitLabel}">${g}</svg>`;
}
function lineSVG(vals, labels, active) {
  const W = 640, H = 210, pl = 8, pr = 8, pt = 28, pb = 28, ih = H - pt - pb, n = vals.length;
  const ok = vals.filter(v => v != null); if (!ok.length) return `<div class="empty">Chưa có dữ liệu.</div>`;
  const lo = Math.min(...ok) * .85, hi = Math.max(...ok) * 1.08, bw = (W - pl - pr) / n;
  const avg = ok.reduce((a, b) => a + b, 0) / ok.length, Y = v => pt + ih * (1 - (v - lo) / (hi - lo || 1));

    ${DATA.members.filter(m => counts[m.id]).map(m => `<button class="fchip" aria-pressed="${f.member === m.id}" data-tf-mem="${m.id}">${esc(sn(m.id))} <b class="num">${counts[m.id]}</b></button>`).join("")}</div>

/* Gợi ý cố định trong ngày: cùng ngày + cùng điều kiện thời tiết => cùng kết quả cho mọi người */
function dailySuggestion() {
  const day = todayStr(), I = wInfo(), maxM = I.maxM, recent = recentDishes(), why = [];
  let pool = CAT.filter(c => c.suggest && c.dist != null).sort((a, b) => a.id.localeCompare(b.id));
  const noRecent = pool.filter(c => !recent.includes(c.dish)); if (noRecent.length) { pool = noRecent; why.push(`Không trùng 3 bữa gần nhất (${recent.join(", ")})`); }
  const why0 = I.keys.filter(x => x !== "humid").map(x => WSTATE[x].label).join(", ");
  if (maxM) {
    const near = pool.filter(c => c.dist <= maxM);
    if (near.length) { pool = near; why.unshift(`${why0}: chỉ chọn trong ${near.length} quán ≤ ${maxM} m`); }
    else { pool = pool.slice().sort((a, b) => a.dist - b.dist).slice(0, 3); why.unshift(`${why0}: không có quán ≤ ${maxM} m, chọn trong 3 quán gần nhất`); }
  } else if (I.primary === "nice") why.unshift("Thời tiết dễ chịu: không giới hạn khoảng cách");
  else if (I.primary === "unknown") why.unshift("Chưa có dữ liệu thời tiết: chọn theo lịch sử ăn của nhóm");
  if (I.keys.includes("cold")) why.unshift("Trời lạnh: ưu tiên món nước nóng");
  if (!pool.length) return null;
  const w = pool.map(c => (1 + Math.sqrt(c.n)) * (I.keys.includes("cold") && SOUP.includes(c.cat) ? 1.8 : 1) * (I.keys.includes("hot") ? 1.3 - c.dist / 1000 : 1));
  const tot = w.reduce((a, b) => a + b, 0), r = seeded(hashStr(`${day}|${I.seedKey}|v2`))() * tot;
  let acc = 0, i = 0; for (; i < pool.length - 1; i++) { acc += w[i]; if (r < acc) break; }
  return {c: pool[i], why, day, poolSize: pool.length};
}

        : `<div class="nm" style="font-size:16px">Chưa có quán phù hợp</div><div class="meta">Danh mục chưa có quán nào có khoảng cách.</div>`}</div>
      <div class="acts">${c ? `${dirBtn(c)}<button class="btn pri" data-r="copy">Sao chép gửi nhóm</button>` : ""}</div>
      <p class="hint" style="padding:0 16px;text-align:center">Gợi ý cố định trong ngày: mọi thành viên, mỗi lần mở đều thấy cùng một món. Gợi ý chỉ đổi khi dự báo trưa chuyển sang nhóm thời tiết khác.</p>
      <div class="rlabel">Xem thử theo thời tiết <span style="font-weight:400">(chỉ để kiểm tra quy tắc)</span></div>
      <div class="chips">${["", "nice", "rain", "storm", "hot", "cold", "dust"].map(k => `<button class="chip" aria-pressed="${W.sim === k}" data-r="sim" data-v="${k}">${k ? WSTATE[k].label : "Dự báo thật"}</button>`).join("")}</div>`;
  } else {
    const inPool = c => R.sel.has(key(c)) && (!maxM || !R.fitWeather || c.dist == null || c.dist <= maxM);
    const pool = CAT.filter(inPool);
    const c = R.pick && inPool(R.pick) ? R.pick : null;
    body = `<div class="wx-mini">${wIcon(st, 18)}<span>${esc(wShort())}${maxM ? ` · chỉ nên đi quán ≤ ${maxM} m` : ""}</span></div>
      <div class="pick" aria-live="polite"><div class="lbl">${pool.length} lựa chọn trong vòng quay</div>
        <div class="nm" id="slot">${c ? esc(c.dish) : "?"}</div><div class="meta" id="slotMeta">${c ? `${distTxt(c)} · ${priceTxt(c)}` : "Chọn các quán bên dưới rồi nhấn Quay"}</div></div>
      <div class="acts"><button class="btn pri" data-r="spin" ${pool.length < 2 ? "disabled" : ""}>Quay</button>${c ? `${dirBtn(c)}<button class="btn" data-r="copy">Sao chép gửi nhóm</button>` : ""}</div>
      ${maxM ? `<label class="toggle"><input type="checkbox" data-r="fit" ${R.fitWeather ? "checked" : ""}>Chỉ quay các quán ≤ ${maxM} m (phù hợp thời tiết)</label>` : ""}
      <div class="rlabel"><span>Quán đưa vào vòng quay</span><span><button data-r="all">Chọn tất cả</button><button data-r="none">Bỏ chọn</button></span></div>
      ${CATS.map(g => `<div class="rlabel" style="padding-top:8px"><span><i class="cdot" style="--cc:${catColor(g)}"></i>${esc(g)}</span><button data-r="cat" data-v="${esc(g)}">Chọn cả nhóm</button></div>
        <div class="chips">${CAT.filter(x => x.cat === g).map(x => { const far = maxM && x.dist > maxM; return `<button class="chip${far ? " far" : ""}" aria-pressed="${R.sel.has(key(x))}" data-r="toggle" data-v="${esc(key(x))}">${esc(x.dish)}<small>${x.dist ?? "?"} m</small></button>`; }).join("")}</div>`).join("")}
      <p class="hint" style="padding:0 16px">Số nhỏ cạnh tên = khoảng cách đến công ty (đang là số mẫu). Nhà hàng/lẩu không chọn sẵn.</p>`;
  }
  const wasOpen = $("#ov").classList.contains("open"), sc = $("#sheet").scrollTop;
  openSheet(head + tabs + body);
  if (wasOpen) $("#sheet").scrollTop = sc;
}
function refreshEat() {
  if ($("#ov").classList.contains("open") && $("#sheet .seg [data-r]")) eatSheet();
  if (S.tab === "overview") { const el = $("#eatCard"); if (el) el.outerHTML = eatCard(); }
}
function eatCard() {
  const s = dailySuggestion(), I = wInfo(), st = I.primary, c = s?.c;
  const live = !W.sim && W.status === "ok";
  const wtxt = W.sim ? WSTATE[st].label + " (xem thử)" : W.status === "loading" ? "Đang tải thời tiết" : W.status === "ok" ? `${WSTATE[st].label}${W.aq === "ok" ? `, PM2.5 ${Math.round(W.pm25)}` : ""}` : "Chưa có thời tiết";
  const pct = c?.dist != null ? Math.max(6, Math.min(100, c.dist / 900 * 100)) : 0;
  return `<section class="sec tk tk-${st}" id="eatCard" aria-label="Gợi ý trưa nay">
    <button class="tk-main" data-eat="suggest" aria-label="Xem chi tiết gợi ý trưa nay">
      <span class="tk-orb" aria-hidden="true">${wIcon(st, 16)}<b class="num">${live ? Math.round(liveNow() ? W.cur.temp : W.temp) + "°" : "–"}</b></span>
      <span class="tk-body">
        <span class="tk-lbl">Trưa nay ăn</span>
        <span class="tk-dish">${c ? esc(c.dish) : "Chưa có gợi ý"}</span>
        <span class="tk-meta">${c ? `<span class="tk-walk" aria-hidden="true"><i style="width:${pct}%"></i></span><span class="num">${c.dist} m · ${c.walk} phút</span>` : ""}<span class="tk-wx">${esc(wtxt)}</span></span>
      </span>
    </button>
    <button class="tk-stub" data-eat="spin" aria-label="Quay ngẫu nhiên">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1.3" fill="currentColor" stroke="none"/></svg>
      <small>Quay</small></button>
  </section>`;
}
function spin() {
  const maxM = wInfo().maxM;
  const pool = CAT.filter(c => R.sel.has(key(c)) && (!maxM || !R.fitWeather || c.dist == null || c.dist <= maxM));
  if (R.rolling || pool.length < 2) return;
  const final = pool[rnd(pool.length)], slot = $("#slot"), meta = $("#slotMeta");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  R.rolling = true; R.pick = null;
  let k = 0, steps = reduce ? 0 : 18, delay = 45;
  const tick = () => {
    if (k < steps) { slot.textContent = pool[rnd(pool.length)].dish; slot.classList.add("rolling"); meta.textContent = "Đang quay…"; k++; delay *= 1.09; setTimeout(tick, delay); return; }
    R.rolling = false; R.pick = final; eatSheet();
  };
  tick();
}
function copyPick() {
  const c = R.mode === "suggest" ? dailySuggestion()?.c : R.pick; if (!c) return;
  const wx = !W.sim && (W.status === "ok" || W.aq === "ok") ? ` Thời tiết trưa: ${wShort()}.` : "";
  const du = dirUrl(c), txt = `Trưa nay ăn: ${c.dish}${c.name ? ` (${c.name})` : ""}, ${distTxt(c)}, ${priceTxt(c)}.${wx}${du ? `\nChỉ đường: ${du}` : ""}`;
  const done = () => { const b = $('#sheet [data-r="copy"]'); if (b) b.textContent = "Đã sao chép"; };
  try { navigator.clipboard.writeText(txt).then(done, () => prompt("Sao chép nội dung:", txt)); } catch (e) { prompt("Sao chép nội dung:", txt); }
}
function onEat(b) {
  const a = b.dataset.r, v = b.dataset.v;
  if (a === "mode-suggest") return eatSheet("suggest");
  if (a === "mode-spin") { R.pick = null; return eatSheet("spin"); }
  if (a === "sim") { W.sim = v; refreshEat(); return; }
  if (a === "copy") return copyPick();
  if (a === "spin") return spin();
  if (R.rolling) return;
  if (a === "toggle") R.sel.has(v) ? R.sel.delete(v) : R.sel.add(v);
  if (a === "all") CAT.forEach(c => R.sel.add(key(c)));
  if (a === "none") R.sel.clear();
  if (a === "cat") CAT.filter(c => c.cat === v).forEach(c => R.sel.add(key(c)));
  eatSheet();
}

/* ---------- Render & events ---------- */
function render() {
  const v = {overview: vOverview, meals: vMeals, members: vMembers, payments: vPayments}[S.tab] || vOverview;
  $("#view").innerHTML = v();
  document.querySelectorAll("nav.bn button").forEach(b => b.toggleAttribute("aria-current", b.dataset.tab === S.tab) || b.dataset.tab === S.tab && b.setAttribute("aria-current", "page"));
  document.querySelectorAll("nav.bn button").forEach(b => b.dataset.tab === S.tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  const pi = PIDX[S.period], allNow = LIST_TABS.includes(S.tab) && isAll();
  $("#pChip").innerHTML = (allNow ? "Tất cả kỳ" : plabel(S.period)) + CHEV; $("#pChip").classList.toggle("all", allNow);
  const c = $("#chart"); if (c) swipe(c, () => { S.chart = Math.min(2, S.chart + 1); render(); }, () => { S.chart = Math.max(0, S.chart - 1); render(); });
  const pc = $("#pchart"); if (pc) swipe(pc, () => { const O = [5, 4, 1, 2]; S.pchart = O[Math.min(3, O.indexOf(S.pchart) + 1)]; render(); }, () => { const O = [5, 4, 1, 2]; S.pchart = O[Math.max(0, O.indexOf(S.pchart) - 1)]; render(); });
  writeHash();
}
$("#openIssues").addEventListener("click", issuesSheet);
$("#pChip").addEventListener("click", () => openSheet(periodSheetHTML(PER.map(p => p.id), S.period, todayStr().slice(0, 7))));
document.querySelectorAll("nav.bn button").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));
$("#ov").addEventListener("click", e => { if (e.target.id === "ov" || e.target.closest(".x")) closeSheet(); });
$("#sheet").addEventListener("click", e => {
  const pt = e.target.closest("[data-paytab]"); if (pt) { S.payTab = pt.dataset.paytab; return paySheet(); }
  const pw = e.target.closest("[data-paywho]"); if (pw) { S.payWho = S.payWho === pw.dataset.paywho ? null : pw.dataset.paywho; return paySheet(); }
  const cy = e.target.closest("[data-copy]"); if (cy) return copyTxt(cy.dataset.copy, cy);
  const pk = e.target.closest("[data-pick]"); if (pk) { S.period = pk.dataset.pick; S.mf.scope = S.tf.scope = "period"; closeSheet(); render(); return; }
  const fs = e.target.closest("[data-mfset]");
  if (fs && S._mtmp) { const k = fs.dataset.mfset; S._mtmp[k] = fs.dataset.v; if (k === "payer") $("#mfPayer").value = ""; $("#sheet").querySelectorAll(`[data-mfset="${k}"]`).forEach(x => x.setAttribute("aria-pressed", x.dataset.v === S._mtmp[k])); return; }
  if (e.target.closest("[data-mf-reset]")) { S.mf = MF0(); S._mtmp = null; closeSheet(); return render(); }
  if (e.target.closest("[data-mf-apply]")) { const f = S._mtmp; f.rest = $("#mfRest").value; f.from = $("#mfFrom").value; f.to = $("#mfTo").value; if ($("#mfPayer").value) f.payer = $("#mfPayer").value; S.mf = f; S._mtmp = null; closeSheet(); render(); return scrollTo(0, 0); }
  const b = e.target.closest("[data-meal]"); if (b) return mealSheet(b.dataset.meal); const r = e.target.closest("button[data-r]"); if (r) onEat(r); });
$("#sheet").addEventListener("change", e => { if (e.target.dataset.r === "fit") { R.fitWeather = e.target.checked; eatSheet(); } });
$("#openEat").addEventListener("click", () => eatSheet("suggest"));
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

$("#view").addEventListener("click", e => {
  if (e.target.closest("[data-open-pay]")) return paySheet();
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.meal) return mealSheet(d.meal);
  if (d.eat) { if (d.eat === "spin") R.pick = null; return eatSheet(d.eat); }
  if (d.member) return go("members", {member: d.member});
  if (d.chart) { S.chart = +d.chart; return render(); }
  if (d.catScope) { S.catScope = d.catScope; return render(); }
  if (d.catBy) { S.catBy = d.catBy; return render(); }
  if (d.act === "fund") { S.fundOpen = !S.fundOpen; return render(); }
  if (d.pchart) { S.pchart = +d.pchart; return render(); }
  if (d.scopeToggle !== undefined) { S.mf.scope = S.tf.scope = isAll() ? "period" : "all"; return render(); }
  if (d.mscope2) { S.memberScope = d.mscope2; return render(); }
  if (d.act === "payments") return go("payments", {tf: {...S.tf, scope: "period", type: "deposit", member: ""}});
  if (d.act === "meals") return go("meals", {mf: {...S.mf, scope: "period"}});
  if (d.act === "meals-all") return go("meals", {mf: {...S.mf, scope: "period"}});
  if (d.openMfilter !== undefined) return mealFilterSheet();
  if (d.rmMf) { if (d.rmMf === "*") S.mf = MF0(); else if (d.rmMf === "date") { S.mf.from = ""; S.mf.to = ""; } else S.mf[d.rmMf] = ""; return render(); }
  if (d.mfMem !== undefined) { S.mf.member = d.mfMem; return render(); }
  if (d.tfMem !== undefined) { S.tf.member = d.tfMem; return render(); }
  if (d.ttype) { S.tf.type = d.ttype; S.tf.member = ""; return render(); }
});
$("#view").addEventListener("change", e => {
  const t = e.target;
  if (t.id === "mSel") { S.member = t.value; return render(); }
  if (t.dataset.mf) { S.mf[t.dataset.mf] = t.value; return render(); }
  if (t.dataset.tf) { S.tf[t.dataset.tf] = t.value; return render(); }
});
let qT; $("#view").addEventListener("input", e => {
  if (e.target.id !== "fq") return;
  clearTimeout(qT); const v = e.target.value;
  qT = setTimeout(() => { S.mf.q = v; render(); const i = $("#fq"); i.focus(); i.setSelectionRange(v.length, v.length); }, 250);
});

readHash(); render(); loadWeather();
})();
</script>
</body>
