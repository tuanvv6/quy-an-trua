<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quỹ ăn trưa: Quản trị</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7F8; --surface:#FFFFFF; --surface-2:#F9F9FB; --ink:#18181B; --ink-2:#3F3F46; --muted:#8B8B94;
  --line:#E7E7EC; --line-2:#F0F0F3; --chip:#F1F1F4;
  --vt:#EE0033; --vt-d:#C2002A; --vt-bg:#FFF0F3; --vt-soft:#FFD3DC;
  --money:#3D4A5C; --money-bg:#EEF1F5; --food:#F59E0B; --food-d:#B45309; --food-bg:#FFF6E5; --adv:#8E4EC6; --adv-bg:#F6EFFC;
  --ok:#12A594; --warn:#B45309; --warn-bg:#FFF6E5;
  --nav-h:62px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0B0E; --surface:#16161A; --surface-2:#1C1C21; --ink:#EDEDF0; --ink-2:#C7C7CE; --muted:#8B8B94; --line:#2A2A31; --line-2:#212127; --chip:#222228;
  --vt:#FF3358; --vt-d:#FF6680; --vt-bg:#2D1016; --vt-soft:#4A1A24; --money:#A9B6C8; --money-bg:#1B2129;
  --food:#FBBF24; --food-d:#FCD34D; --food-bg:#2B210E; --adv:#B57FE6; --adv-bg:#26193A; --warn:#FCD34D; --warn-bg:#2B210E; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0B0B0E; --surface:#16161A; --surface-2:#1C1C21; --ink:#EDEDF0; --ink-2:#C7C7CE; --muted:#8B8B94; --line:#2A2A31; --line-2:#212127; --chip:#222228;
  --vt:#FF3358; --vt-d:#FF6680; --vt-bg:#2D1016; --vt-soft:#4A1A24; --money:#A9B6C8; --money-bg:#1B2129;
  --food:#FBBF24; --food-d:#FCD34D; --food-bg:#2B210E; --adv:#B57FE6; --adv-bg:#26193A; --warn:#FCD34D; --warn-bg:#2B210E; color-scheme:dark;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
:focus-visible{outline:2px solid var(--vt);outline-offset:2px;border-radius:8px}

/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--line);box-shadow:inset 0 3px 0 var(--vt)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:58px;padding-top:3px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px;flex:1;min-width:0}
.brand::before{content:"";width:20px;height:20px;border-radius:6px;flex:none;box-shadow:inset 0 0 0 5px var(--vt),inset 0 0 0 8px var(--surface);background:var(--vt)}
.role{font-size:11.5px;font-weight:600;color:var(--vt);background:var(--vt-bg);border-radius:999px;padding:2px 8px}
.top a{font-size:13px;color:var(--vt);text-decoration:none;font-weight:500;white-space:nowrap}

h1{font-size:28px;font-weight:700;letter-spacing:-.025em;margin:18px 0 2px}
.sub{color:var(--muted);font-size:13.5px}
h2{font-size:17px;font-weight:600;letter-spacing:-.02em;margin:0}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin:14px 0;overflow:hidden}
.sec-h{display:flex;align-items:baseline;gap:10px;padding:14px 16px 10px;flex-wrap:wrap}
.sec-h .meta{margin-left:auto;font-size:12.5px;color:var(--muted)}
.sec-h .lnk{margin-left:auto;border:0;background:none;color:var(--vt);font-weight:500;font-size:13.5px;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:.5px solid var(--line)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted)}
.row .amt{font-weight:600;text-align:right}
.row .amt small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}

/* quick actions */
.today{display:flex;gap:12px;align-items:center;padding:14px 16px}
.today .dot{width:10px;height:10px;border-radius:50%;background:var(--food);flex:none;box-shadow:0 0 0 4px var(--food-bg)}
.today.done .dot{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 15%,transparent)}
.today b{display:block;font-size:15px}
.today span{font-size:13px;color:var(--muted)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.qa button{border:0;border-radius:16px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:104px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.qa button.pri{background:var(--vt);color:#fff;box-shadow:none}
.qa .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--chip)}
.qa .pri .ic{background:rgba(255,255,255,.2)}
.qa b{font-size:16px;font-weight:600}
.qa small{display:block;font-size:12.5px;opacity:.75;font-weight:400}
.repeat{width:100%;display:flex;align-items:center;gap:12px;border:1px dashed var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left}
.repeat .main{flex:1;min-width:0}
.repeat b{font-weight:600}
.repeat span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.repeat em{font-style:normal;font-size:13px;font-weight:600;color:var(--vt);white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border-top:.5px solid var(--line)}
.kpis div{padding:10px 14px;border-right:.5px solid var(--line-2)}
.kpis div:last-child{border-right:0}
.kpis span{display:block;font-size:11.5px;color:var(--muted)}
.kpis b{font-size:15px;font-weight:600}
@media (max-width:560px){.kpis{grid-template-columns:1fr 1fr}.kpis div:nth-child(2){border-right:0}.kpis div:nth-child(-n+2){border-bottom:.5px solid var(--line-2)}}
.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:5px;padding:1px 6px;vertical-align:1px}
.b-meal{background:var(--food-bg);color:var(--food-d)}
.b-dep{background:var(--money-bg);color:var(--money)}
.b-adv{background:var(--adv-bg);color:var(--adv)}
.b-new{background:var(--vt-bg);color:var(--vt)}
.b-open{background:var(--chip);color:var(--ink-2)}
.b-closed{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.warnbox{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;margin:0 16px 14px;font-size:13px}
.warnbox button{margin-left:auto;border:0;background:none;color:inherit;font-weight:600;text-decoration:underline;padding:0;white-space:nowrap}
.iconbtn{border:0;background:var(--chip);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);flex:none}

/* segmented */
.seg{display:flex;background:var(--chip);border-radius:10px;padding:2px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1 0 auto;border:0;background:none;border-radius:8px;padding:7px 12px;font-size:13.5px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* form sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,10,14,.45);display:none;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;height:94vh;height:94dvh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
@media (min-width:700px){.ov{align-items:center}.sheet{height:auto;max-height:90vh;border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sh-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:.5px solid var(--line);background:var(--surface);border-radius:20px 20px 0 0}
.sh-h h3{margin:0;font-size:18px;font-weight:700;letter-spacing:-.02em;flex:1}
.sh-b{flex:1;overflow:auto;padding:4px 0 16px}
.sh-f{padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-top:.5px solid var(--line);display:flex;gap:10px;align-items:center}
.save{flex:1;height:50px;border:0;border-radius:14px;background:var(--vt);color:#fff;font-weight:600;font-size:16px}
.save:disabled{opacity:.35;cursor:default}
.ghost{height:50px;border:0;border-radius:14px;background:var(--chip);color:var(--ink);font-weight:600;padding:0 16px}
.del{height:50px;border:0;border-radius:14px;background:var(--vt-bg);color:var(--vt);font-weight:600;padding:0 16px}
.fld{padding:14px 16px 0}
.lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:8px}
.lbl small{font-weight:400;color:var(--muted)}
.lbl button{border:0;background:none;color:var(--vt);font-weight:500;font-size:13px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:9px 12px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;min-height:42px}
.chip small{font-size:11.5px;color:var(--muted);font-weight:400}
.chip[aria-pressed="true"]{background:var(--vt-bg);color:var(--vt-d);box-shadow:inset 0 0 0 1.5px var(--vt);font-weight:600}
.chip[aria-pressed="true"] small{color:var(--vt)}
.addg{margin-top:10px;border:0;background:none;color:var(--vt);font-weight:500;font-size:13.5px;padding:4px 0}
.guests{display:flex;flex-wrap:wrap;gap:8px}
.guests .lbl{width:100%}
.gst{display:inline-flex;align-items:center;gap:6px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:4px 4px 4px 12px;font-size:14px}
.gst b{min-width:16px;text-align:center}
.step{width:32px;height:32px;border:0;border-radius:9px;background:var(--chip);font-size:17px;font-weight:600;line-height:1}
.chip.sugg{box-shadow:inset 0 0 0 1.5px var(--food)}
.chip .star{color:var(--food);font-size:12px}
.mchip{position:relative;padding-right:12px}
.mchip .g{display:none;align-items:center;gap:2px;margin-left:4px;background:rgba(255,255,255,.16);border-radius:8px;padding:0 2px}
.mchip[aria-pressed="true"] .g{display:inline-flex}
.mchip .g i{font-style:normal;width:24px;height:24px;display:grid;place-items:center;border-radius:6px;font-weight:700}
.mchip .g i:hover{background:rgba(255,255,255,.18)}
.mchip .g em{font-style:normal;font-size:12px;min-width:44px;text-align:center}
.input{width:100%;height:48px;border:0;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);padding:0 14px;font-size:16px}
.input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--vt)}
.amount{position:relative;display:flex;align-items:center;background:var(--surface);border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);height:64px;padding:0 16px}
.amount:focus-within{box-shadow:inset 0 0 0 2px var(--vt)}
.amount input{flex:1;min-width:0;border:0;background:none;font-size:28px;font-weight:700;letter-spacing:-.02em;outline:none;text-align:right;font-variant-numeric:tabular-nums}
.amount .suf{font-size:22px;font-weight:600;color:var(--muted);margin-left:2px}
.recent-amt{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.recent-amt button{border:0;background:var(--chip);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:500}
.split{margin:14px 16px 0;background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:inset 0 0 0 1px var(--line);font-size:13.5px}
.split .big{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.split .big b{font-size:17px}
.split .ppl{color:var(--muted);font-size:12.5px;margin-top:4px}
.split .note{margin-top:8px;padding-top:8px;border-top:.5px solid var(--line);font-size:12.5px;color:var(--adv)}
.pick-row{display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;background:var(--surface);border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);position:relative}
.pick-row span{font-size:14px;font-weight:600;color:var(--ink-2);flex:1}
.pick-row select{appearance:none;-webkit-appearance:none;border:0;background:none;font-size:15px;font-weight:600;text-align:right;padding-right:2px;cursor:pointer;color:var(--ink)}
.pick-row svg{color:var(--muted);flex:none;pointer-events:none}
.pick-row.alt{box-shadow:inset 0 0 0 1.5px var(--adv)}
.pick-row.alt select{color:var(--adv)}
.pick-row:focus-within{box-shadow:inset 0 0 0 2px var(--vt)}
.donote{display:inline-flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--ink-2);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:5px 12px}
.donote i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.search{position:relative;margin-top:8px}
.search input{padding-left:36px}
.search svg{position:absolute;left:12px;top:15px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{padding:9px 12px;text-align:right;border-top:.5px solid var(--line)}
.tbl th{white-space:nowrap;font-size:11.5px;color:var(--muted);font-weight:500}
.tbl th:first-child,.tbl td:first-child{text-align:left;white-space:nowrap}
.tbl tfoot td{font-weight:600;border-top:1px solid var(--ink)}
.tbl-wrap{overflow-x:auto}
.checks{list-style:none;margin:0;padding:0 16px 8px}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:13.5px}
.checks li i{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;margin-top:1px}
.checks .ok i{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.checks .wn i{background:var(--warn-bg);color:var(--warn)}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--vt);outline-offset:2px}

/* nav */
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bn .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h);padding:0}
nav.bn button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--muted)}
nav.bn button[aria-current="page"]{color:var(--vt)}
@media (min-width:1024px){
  body{padding-bottom:24px}
  nav.bn{top:3px;bottom:auto;left:50%;right:auto;transform:translateX(-50%);background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none}
  nav.bn .wrap{display:flex;height:58px;align-items:center;gap:4px}
  nav.bn button{flex-direction:row;gap:8px;font-size:14px;height:36px;padding:0 14px;border-radius:10px;color:var(--ink-2)}
  nav.bn button[aria-current="page"]{background:var(--vt-bg);color:var(--vt)}
  nav.bn svg{width:18px;height:18px}
}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;
  background:var(--ink);color:var(--surface);border-radius:14px;padding:12px 14px 12px 16px;display:flex;gap:14px;align-items:center;font-size:14px;max-width:calc(100% - 32px);transition:all .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast button{white-space:nowrap;border:0;background:none;color:var(--vt-soft);font-weight:600;padding:0}
@media (min-width:1024px){.toast{bottom:24px}}
.row.tap{cursor:pointer}
.row.tap:hover{background:var(--surface-2)}
.row .ppl{font-size:12.5px;color:var(--ink-2);margin-top:2px;line-height:1.4}
.advtxt{color:var(--adv)}
.cta-bar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));z-index:25;padding:10px 16px 10px;
  background:linear-gradient(to top,var(--bg) 70%,color-mix(in srgb,var(--bg) 0%,transparent));display:flex;flex-direction:column;gap:8px;max-width:860px;margin:0 auto}
.cta-row{display:grid;grid-template-columns:auto 1fr;gap:10px}
.cta-row .cta-sec{padding:0 18px}
.cta-pri,.cta-sec{white-space:nowrap;height:54px;border:0;border-radius:16px;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.cta-pri{background:var(--vt);color:#fff;box-shadow:0 8px 20px -10px var(--vt)}
.cta-sec{font-size:15px !important;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.cta-repeat{height:40px;border:0;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;gap:8px;padding:0 12px;font-size:13.5px;color:var(--ink-2)}
.cta-repeat span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cta-repeat svg{color:var(--vt);flex:none}
body:has(.cta-bar){padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 90px)}
@media (min-width:1024px){.cta-bar{bottom:16px;border-radius:20px}body:has(.cta-bar){padding-bottom:140px}}
.vhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 16px 0}
.vhead span{display:block;font-size:13px;color:var(--muted)}
.vhead b{font-size:28px;font-weight:700;letter-spacing:-.02em}
.vkv{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-2);margin:14px 16px 0;border-radius:12px;overflow:hidden;border:1px solid var(--line-2)}
.vkv div{background:var(--surface);padding:10px 12px;min-width:0}
.vkv span{display:block;font-size:11.5px;color:var(--muted)}
.vkv b{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.seg .pp-more{border:0;background:none;font-size:13.5px;font-weight:500;padding:0 8px;color:var(--ink-2);flex:0 0 auto}
.period-status{display:flex;gap:14px;align-items:center;padding:16px}
.period-status b{display:block;font-size:15px}
.period-status span{font-size:13px;color:var(--muted)}
.ps-ic{width:52px;height:52px;border-radius:14px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.open .ps-ic{background:var(--vt-bg);color:var(--vt)}
.open .ps-ic b{font-size:20px;font-weight:700}
.open .ps-ic small{font-size:11px}
.done .ps-ic{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);font-size:22px;font-weight:700}
.depgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px 4px}
@media (max-width:420px){.depgrid{grid-template-columns:repeat(3,1fr)}}
.dep{border:0;border-radius:12px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:58px;justify-content:center;

<script src="config.js"></script>
<script>
/* ================== KẾT NỐI GOOGLE SHEETS ================== */
/* Đường link máy chủ lấy từ file config.js (cùng thư mục). Không cần sửa ở đây. */
const CFG = window.QUY_CONFIG || {};
const API_URL = String(CFG.API_URL || "").trim();
/* ============================================================ */

const CONN = {from: null, time: null, raw: null};
const CACHE_KEY = "quy-an-trua:cache:v1";
const apiReady = () => /^https?:\/\//.test(API_URL);
const tzMonth = () => new Intl.DateTimeFormat("en-CA", {timeZone: "Asia/Ho_Chi_Minh", year: "numeric", month: "2-digit"}).format(new Date()).slice(0, 7);
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };

async function apiGet() {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 20000);
  try {
    const r = await fetch(API_URL + (API_URL.includes("?") ? "&" : "?") + "action=data&t=" + Date.now(), {signal: ctl.signal, redirect: "follow"});
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "Lỗi máy chủ");
    return j;
  } finally { clearTimeout(t); }
}
async function apiPost(body) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 30000);
  try {
    const r = await fetch(API_URL, {method: "POST", body: JSON.stringify(body), signal: ctl.signal, redirect: "follow"});
    return await r.json();
  } finally { clearTimeout(t); }
}

const normP = v => { const s = String(v || ""); if (/^\d{4}-\d{2}/.test(s)) return s.slice(0, 7); const d = new Date(s); return isNaN(d) ? "" : new Intl.DateTimeFormat("en-CA", {timeZone: "Asia/Ho_Chi_Minh", year: "numeric", month: "2-digit"}).format(d).slice(0, 7); };
const normD = v => { const s = String(v || ""); if (!s) return null; if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10); const d = new Date(s); return isNaN(d) ? null : new Intl.DateTimeFormat("en-CA", {timeZone: "Asia/Ho_Chi_Minh"}).format(d); };

/* Dựng dữ liệu cho giao diện từ các bảng trong Google Sheets.
   Số dư đầu kỳ được tính lại: đầu kỳ tháng sau = cuối kỳ tháng trước (làm tròn đồng); quản lý luôn về 0. */
function buildData(raw) {
  const members = (raw.members || []).slice().sort((a, b) => (a.sort ?? 999) - (b.sort ?? 999))
    .map(m => ({id: m.id, name: m.name, manager: !!m.manager, active: !!m.active}));
  const parts = {};
  (raw.meal_parts || []).forEach(p => (parts[p.meal_id] ||= []).push({m: p.member_id, own: +p.own || 0, guest: +p.guest || 0}));
  const txs = (raw.transactions || []).map(t => ({id: t.id, period: normP(t.period), date: normD(t.date), m: t.member_id, type: t.type, amount: +t.amount || 0,
    meal: t.meal_id || null, method: t.method || "", note: t.note || null, src: t.src || "", settle: !!t.settle}));
  const order = Object.fromEntries(members.map((m, i) => [m.id, i]));
  const meals = (raw.meals || []).map(m => {
    const ps = (parts[m.id] || []).sort((a, b) => (order[a.m] ?? 99) - (order[b.m] ?? 99));
    const adv = txs.filter(t => t.type === "advance" && t.meal === m.id).map(t => ({m: t.m, amount: t.amount}));
    const paid = adv.reduce((s, x) => s + x.amount, 0), total = +m.total || 0;
    return {id: m.id, period: normP(m.period), date: normD(m.date), restaurant: m.restaurant || "Không rõ", category: m.category || "Khác", event: !!m.event,
      total, parts: ps, payers: total - paid > 1 ? [{m: "fund", amount: total - paid}, ...adv] : adv, note: m.note || null,
      formulaNote: m.formula_note || null, src: m.src || ""};
  }).filter(m => m.parts.length);

  // Danh sách kỳ: từ tháng có dữ liệu sớm nhất đến tháng hiện tại
  const cur = tzMonth(), ids = [...meals.map(m => m.period), ...txs.map(t => t.period)].filter(Boolean).sort();
  const first = ids[0] || cur, lastP = [ids.at(-1) || cur, cur].sort().at(-1);
  const pids = []; for (let [y, mo] = first.split("-").map(Number), g = 0; g < 600; g++, mo === 12 ? (y++, mo = 1) : mo++) { const id = `${y}-${String(mo).padStart(2, "0")}`; pids.push(id); if (id >= lastP) break; }
  const byP = id => ({ms: meals.filter(m => m.period === id), ts: txs.filter(t => t.period === id)});
  let prev = {};
  const periods = pids.map(id => {
    const {ms, ts} = byP(id), opens = {}, mem = [];
    members.forEach(M => {
      const k = M.id, open = M.manager ? 0 : (prev[k] || 0);
      const dep = ts.filter(t => t.m === k).reduce((s, t) => s + t.amount, 0);
      const cost = ms.reduce((s, m) => { const p = m.parts.find(x => x.m === k); if (!p) return s; const n = m.parts.reduce((a, q) => a + q.own + q.guest, 0); return s + m.total * (p.own + p.guest) / n; }, 0);
      const inP = Math.abs(open) >= 1 || dep || cost || (id >= cur && M.active);
      opens[k] = open; if (inP) mem.push(k);
      prev[k] = Math.round(open + dep - cost);
    });
    return {id, label: `T${+id.slice(5)}/${id.slice(0, 4)}`, opens, members: mem};
  });
  members.forEach(M => { const ps = periods.filter(p => p.members.includes(M.id)).map(p => p.id); M.from = ps[0] || cur; M.to = ps.at(-1) || cur; });

  const restaurants = (raw.restaurants || []).map(r => ({id: r.id, name: r.name || null, dish: r.dish, cat: r.cat || "Khác", lat: r.lat ?? null, lon: r.lon ?? null,
    distanceM: r.distance_m ?? null, sample: !!r.sample_loc, suggest: r.suggest !== false, active: r.active !== false, mapsUrl: r.maps_url || null, sampleLoc: !!r.sample_loc}));

const SYNC = {snap: null, audit: [], timer: null, busy: false, again: false, state: "ok", savedAt: null, err: ""};

    const up = Object.keys(b[k]).filter(id => a[k][id] !== b[k][id]).map(id => JSON.parse(b[k][id]));
    const del = Object.keys(a[k]).filter(id => !(id in b[k]));
    if (up.length || del.length) ch[k] = {upsert: up, delete: del};

}

  SYNC.busy = true; SYNC.state = "saving"; paintSync();

    const j = await apiPost({action: "sync", pin: lsGet(PIN_KEY), who: ADMIN_NAME, changes, audit});
    if (!j.ok) throw Object.assign(new Error(j.error), {code: j.error});
    SYNC.snap = now; SYNC.audit.splice(0, audit.length); SYNC.state = "ok"; SYNC.savedAt = new Date(); SYNC.err = "";

}

function periodStats(pid) {

/* ---------- charts (dùng chung với trang thành viên) ---------- */
const shortN = n => { const a = Math.abs(n); if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace(".", ",") + "tr"; if (a >= 1e3) return Math.round(n / 1e3) + "k"; return String(Math.round(n)); };
const mlabel = id => `${+id.slice(5, 7)}/${id.slice(2, 4)}`;
const CATCOL = {"Bún": "#12A594", "Cơm": "#E2900B", "Phở": "#E5484D", "Cháo / Lòng": "#AB4ABA", "Bánh mì": "#B88A3E", "Vịt quay": "#A07553",
  "Lẩu": "#D6409F", "Nhà hàng": "#5B5BD6", "Chả cá": "#0797B9", "Sự kiện / Quà": "#8E4EC6", "Không rõ": "#A1A1AA", "Khác": "#8B8B94"};
function barSVG(values, labels, active, unitLabel, raw) {
  const W = 640, H = 210, pl = 8, pr = 8, pt = 22, pb = 28;
  const max = Math.max(...values, 1), n = values.length;
  const bw = (W - pl - pr) / n, gap = Math.min(14, bw * .3);
  let g = "";
  [0, .5, 1].forEach(f => { const y = pt + (H - pt - pb) * (1 - f); g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="var(--line-2)" stroke-width="1"/>`; });
  values.forEach((v, i) => {
    const h = (H - pt - pb) * v / max, x = pl + i * bw + gap / 2, y = H - pb - h, on = i === active;
    g += `<rect x="${x}" y="${y}" width="${bw - gap}" height="${Math.max(h, v ? 2 : 0)}" rx="3" fill="${on ? "var(--b-on)" : "var(--b-off)"}"><title>${esc(labels[i])}: ${vndU(v)}</title></rect>`;
    g += `<text x="${x + (bw - gap) / 2}" y="${y - 6}" text-anchor="middle" font-size="11" fill="${on ? "var(--ink)" : "var(--muted)"}" font-weight="${on ? 600 : 400}" class="num">${raw ? v : v ? shortN(v) : "0"}</text>`;
    g += `<text x="${x + (bw - gap) / 2}" y="${H - 9}" text-anchor="middle" font-size="11" fill="${on ? "var(--ink)" : "var(--muted)"}" font-weight="${on ? 600 : 400}">${esc(labels[i])}</text>`;

}
function lineSVG(vals, labels, active, ref = "TB") {
  const W = 640, H = 210, pl = 8, pr = 8, pt = 28, pb = 28, ih = H - pt - pb, n = vals.length;
  const ok = vals.filter(v => v != null); if (!ok.length) return `<div class="empty">Chưa có dữ liệu.</div>`;
  const lo = Math.min(...ok) * .85, hi = Math.max(...ok) * 1.08, bw = (W - pl - pr) / n;
  const avg = ok.reduce((a, b) => a + b, 0) / ok.length, Y = v => pt + ih * (1 - (v - lo) / (hi - lo || 1));

  let seg = [], path = "";
  vals.forEach((v, i) => { const x = pl + i * bw + bw / 2; if (v == null) { if (seg.length) path += "M" + seg.join("L"); seg = []; } else seg.push(x + "," + Y(v)); });
  if (seg.length) path += "M" + seg.join("L");
  g += `<path d="${path}" fill="none" stroke="var(--b-on)" stroke-width="2.2" stroke-linejoin="round"/>`;
  vals.forEach((v, i) => {
    const x = pl + i * bw + bw / 2, on = i === active;
    g += `<text x="${x}" y="${H - 9}" text-anchor="middle" font-size="11" fill="${on ? "var(--ink)" : "var(--muted)"}" font-weight="${on ? 600 : 400}">${esc(labels[i])}</text>`;
    if (v == null) return;
    g += `<circle cx="${x}" cy="${Y(v)}" r="${on ? 5 : 3.5}" fill="${on ? "var(--b-on)" : "var(--surface)"}" stroke="var(--b-on)" stroke-width="2"><title>${esc(labels[i])}: ${vndU(v)}/suất</title></circle>
      <text x="${x}" y="${Y(v) - 9}" text-anchor="middle" font-size="10.5" font-weight="${on ? 700 : 500}" fill="var(--ink)" class="num">${shortN(v)}</text>`;
  });

}
function comboSVG(bars, line, labels, active) {
  const W = 640, H = 220, pl = 8, pr = 8, pt = 26, pb = 28, ih = H - pt - pb;
  const bmax = Math.max(...bars, 1), lmax = Math.max(...line, 1) * 1.15, n = bars.length;
  const bw = (W - pl - pr) / n, gap = Math.min(16, bw * .35);
  let g = "", pts = [];
  [0, .5, 1].forEach(f => { const y = pt + ih * (1 - f); g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="var(--line-2)"/>`; });
  bars.forEach((v, i) => {
    const h = ih * v / bmax, x = pl + i * bw + gap / 2, y = H - pb - h, on = i === active, cx = x + (bw - gap) / 2;
    g += `<rect x="${x}" y="${y}" width="${bw - gap}" height="${Math.max(h, v ? 2 : 0)}" rx="3" fill="${on ? "var(--b-on)" : "var(--b-off)"}"><title>${esc(labels[i])}: chi phí ${vndU(v)}, ${line[i]} bữa</title></rect>`;
    if (v) g += `<text x="${cx}" y="${H - pb - 4}" text-anchor="middle" font-size="10" fill="${on ? "var(--surface)" : "var(--ink-2)"}" class="num">${shortN(v)}</text>`;
    g += `<text x="${cx}" y="${H - 9}" text-anchor="middle" font-size="11" fill="${on ? "var(--ink)" : "var(--muted)"}" font-weight="${on ? 600 : 400}">${esc(labels[i])}</text>`;
    pts.push([cx, pt + ih * (1 - (.18 + .82 * line[i] / lmax)), line[i], on]);

  g += `<polyline points="${pts.map(p => p[0] + "," + p[1]).join(" ")}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>`;
  pts.forEach(([x, y, v, on]) => { g += `<circle cx="${x}" cy="${y}" r="${on ? 4.5 : 3.5}" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><text x="${x}" y="${y - 9}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)" class="num">${v}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cột: chi phí bữa ăn theo tháng; đường: số bữa tham gia theo tháng">${g}</svg>`;
}

  const b = e.target.closest("button");
  if (!b) { const mr = e.target.closest("[data-member]"); if (mr) return memberSheet(mr.dataset.member);
    const r = e.target.closest("[data-view-meal],[data-view-tx]"); if (r) return r.dataset.viewMeal ? viewMeal(r.dataset.viewMeal) : viewTx(r.dataset.viewTx); return; }
  const d = b.dataset;
  if (d.open === "meal") return mealForm();
  if (d.open === "pay") return payForm();
  if (d.open === "rest") return restForm();
  if (d.open === "issues") return issuesSheet();
  if (d.open === "repeat") { const lm = lastMeal(); mealForm(null, lm); F.amt = String(Math.round(lm.total / 1000)); F.full = lm.total % 1000 !== 0; if (F.full) F.amt = String(lm.total); return drawMeal(); }
  if (d.tabGo) { S.tab = d.tabGo; render(); return scrollTo(0, 0); }
  if (d.editMeal) return mealForm(meals.find(m => m.id === d.editMeal));
  if (d.editTx) return payForm(txs.find(t => t.id === d.editTx));
  if (d.editRest) return restForm(REST.find(r => r.id === d.editRest));
  if (d.scopeToggle !== undefined) { S.flt.all = !S.flt.all; return render(); }
  if (d.ht) { S.ht = d.ht; S.hf = ''; S.flt = {...FLT0(), all: S.flt.all}; return render(); }
  if (d.openFilter !== undefined) return filterSheet();
  if (d.rmFlt) { if (d.rmFlt === '*') S.flt = FLT0(); else if (d.rmFlt === 'date') { S.flt.from = ''; S.flt.to = ''; } else S.flt[d.rmFlt] = d.rmFlt === 'all' ? false : ''; return render(); }
  if (d.audit) { S.showAudit = d.audit === "1"; render(); return scrollTo(0, 0); }
  if (d.gotoHist) { S.tab = 'history'; S.pm = S.pm; S.ht = d.gotoHist; S.hf = ''; S.flt = FLT0(); render(); return scrollTo(0, 0); }
  if (d.sc !== undefined) { S.sc = +d.sc; return render(); }
  if (d.hf !== undefined) { S.hf = d.hf; return render(); }
  if (d.homeTab) { S.homeTab = d.homeTab; return render(); }
  if (d.payFor) { payForm(null, d.payFor); return; }
  if (d.histDep) { S.tab = 'history'; S.pm = d.histDep; S.ht = 'dep'; S.flt = FLT0(); render(); return scrollTo(0, 0); }
  if (d.viewTx) return viewTx(d.viewTx);
  if (d.cat) { S.cat = d.cat; return render(); }
  if (d.pp) { S.closeP = d.pp; return render(); }
  if (d.addMem !== undefined) { const v = $("#newMem").value.trim(); if (!v) return $("#newMem").focus(); const id = "m" + Date.now(); const m = {id, name: v, manager: false, active: true}; MEMBERS.push(m); MEM[id] = m; log("Thêm thành viên", v); render(); return toast("Đã thêm " + v); }
});
$("#view").addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-view-meal],[data-view-tx],[data-member]")) { e.preventDefault(); e.target.click(); } });
let hqT; $("#view").addEventListener("input", e => {
  if (e.target.id !== "hq") return; clearTimeout(hqT); const v = e.target.value;
  hqT = setTimeout(() => { S.flt.q = v; render(); const i = $("#hq"); i.focus(); i.setSelectionRange(v.length, v.length); }, 200);
});
$("#view").addEventListener("change", e => {
  if (e.target.id === "closeSel" && e.target.value) { S.closeP = e.target.value; render(); }
  if (e.target.dataset.memActive) { const m = MEM[e.target.dataset.memActive]; m.active = e.target.checked; log(m.active ? "Bật thành viên" : "Tạm dừng thành viên", m.name); render(); }
});

$("#ov").addEventListener("click", e => {
  if (e.target.id === "ov" || e.target.closest("[data-close]")) return closeSheet();
  const pk = e.target.closest("[data-pick]"); if (pk) { S.pm = pk.dataset.pick; S.flt.all = false; closeSheet(); render(); return; }
  const mc = e.target.closest("[data-mc]"); if (mc) { S.mc = +mc.dataset.mc; const sc = $("#sheet .sh-b").scrollTop; memberSheet(mc.dataset.mid); $("#sheet .sh-b").scrollTop = sc; return; }
  const fs = e.target.closest("[data-fset]");
  if (fs && S._ftmp) { const k = fs.dataset.fset, v = fs.dataset.v; S._ftmp[k] = k === "all" ? v === "true" : v; if (k === "payer") $("#fltPayer").value = ""; $("#sheet").querySelectorAll(`[data-fset="${k}"]`).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v) === String(S._ftmp[k]))); return; }
  if (e.target.closest("[data-flt-reset]")) { S.flt = FLT0(); S._ftmp = null; closeSheet(); return render(); }
  if (e.target.closest("[data-flt-apply]")) { const f = S._ftmp; f.from = $("#fltFrom").value; f.to = $("#fltTo").value; const fp = $("#fltPayer"); if (fp && fp.value) f.payer = fp.value; S.flt = f; S._ftmp = null; closeSheet(); render(); return scrollTo(0, 0); }
  const vb = e.target.closest("[data-edit-meal],[data-edit-tx],[data-view-meal]");
  if (vb && !F) { if (vb.dataset.editMeal) return mealForm(meals.find(m => m.id === vb.dataset.editMeal)); if (vb.dataset.editTx) return payForm(txs.find(t => t.id === vb.dataset.editTx)); return viewMeal(vb.dataset.viewMeal); }
  const g = e.target.closest("[data-f-g]");
  if (g) { syncMeal(); const p = F.parts[g.dataset.fG]; p.guest = Math.max(0, Math.min(9, p.guest + +g.dataset.d)); return drawMeal(); }
  if (e.target.closest("[data-f-showg]")) { syncMeal(); F.showGuest = true; return drawMeal(); }
  const b = e.target.closest("button"); if (!b || !F) return; const d = b.dataset;
  if (F.type === "meal") {
    syncMeal();
    if (d.fDate) { F.date = d.fDate; return drawMeal(); }
    if (d.fRest !== undefined) { F.rest = d.fRest; F.q = ""; return drawMeal(); }
    if (d.fMem) { F.parts[d.fMem] ? delete F.parts[d.fMem] : (F.parts[d.fMem] = {own: 1, guest: 0}); return drawMeal(); }
    if (d.fAll !== undefined) { activeMembers().forEach(m => F.parts[m.id] ||= {own: 1, guest: 0}); return drawMeal(); }
    if (d.fNone !== undefined) { F.parts = {}; return drawMeal(); }
    if (d.fFull !== undefined) { const t = mealTotal(); F.full = !F.full; F.amt = t ? String(F.full ? t : Math.round(t / 1000)) : ""; return drawMeal(); }
    if (d.fAmt) { const a = +d.fAmt; F.full = a % 1000 !== 0; F.amt = String(F.full ? a : a / 1000); return drawMeal(); }
    if (d.fPayer) { F.payer = d.fPayer; return drawMeal(); }
    if (d.fSave !== undefined) return saveMeal();
    if (d.fDelete !== undefined) {
      if (!confirm("Xóa bữa ăn này?")) return;
      const m = meals.find(x => x.id === F.edit), i = meals.indexOf(m), linked = txs.filter(t => t.meal === m.id);
      meals.splice(i, 1); txs.splice(0, txs.length, ...txs.filter(t => t.meal !== m.id)); log("Xóa bữa ăn", `${m.restaurant} ${fdate(m.date)} · ${vndU(m.total)}`);
      closeSheet(); render(); return toast("Đã xóa bữa ăn", () => { meals.splice(i, 0, m); txs.push(...linked); log("Hoàn tác xóa bữa ăn", m.restaurant); });
    }
  }
  if (F.type === "pay") {
    syncPay();
    if (d.pKind) { F.kind = d.pKind; return drawPay(); }
    if (d.pM) { F.m = d.pM; return drawPay(); }
    if (d.pAmt) { F.amt = d.pAmt; return drawPay(); }
    if (d.pMethod) { F.method = d.pMethod; return drawPay(); }
    if (d.pSave !== undefined) return savePay();
    if (d.pDelete !== undefined) { if (!confirm("Xóa giao dịch này?")) return; const t = txs.find(x => x.id === F.edit), i = txs.indexOf(t); txs.splice(i, 1); log("Xóa giao dịch", `${MEM[t.m].name} · ${vndU(t.amount)}`); closeSheet(); render(); return toast("Đã xóa giao dịch", () => { txs.splice(i, 0, t); log("Hoàn tác xóa giao dịch", MEM[t.m].name); }); }
  }
  if (F.type === "rest") {
    if (d.rCat) { syncRest(); F.cat = d.rCat; return drawRest(); }
    if (d.rHelp !== undefined) { syncRest(); F.help = !F.help; return drawRest(); }
    if (d.rPaste !== undefined) { navigator.clipboard?.readText?.().then(v => { $("#rLoc").value = v; liveLoc(); }).catch(() => $("#rLoc").focus()); return; }
    if (d.rSave !== undefined) return saveRest();
  }
});
function syncMeal() { const n = $("#fNote"); if (n) F.note = n.value; const dt = $("#fDate"); if (dt && dt.value) F.date = dt.value; }
function syncPay() { const n = $("#pNote"); if (n) F.note = n.value; const dt = $("#pDate"); if (dt && dt.value) F.date = dt.value; }
$("#ov").addEventListener("input", e => {
  if (!F) return;
  if (e.target.id === "rLoc") return liveLoc();
  if (e.target.id === "rDist") { F.distManual = true; $("#rDistHint").textContent = "mét (đã sửa tay)"; return; }
  if (e.target.id === "fAmt" || e.target.id === "pAmt") { F.amt = e.target.value.replace(/\D/g, ""); e.target.value = F.amt ? NF.format(+F.amt) : ""; }
  if (e.target.id === "fAmt") liveMeal();
  if (e.target.id === "fQ") { F.q = e.target.value; $("#fRestChips").innerHTML = restChips(); $("#fNew").innerHTML = newRestChip(); }
  if (e.target.id === "pAmt") livePay();
});
$("#ov").addEventListener("change", e => {
  if (!F) return;
  if (e.target.id === "fPayer") { F.payer = e.target.value; e.target.closest(".pick-row").classList.toggle("alt", F.payer !== "fund"); return liveMeal(); }
  if (e.target.id === "fDate") { F.date = e.target.value || todayStr(); syncMeal(); drawMeal(); }
  if (e.target.id === "pDate") { F.date = e.target.value || todayStr(); syncPay(); drawPay(); }
});
$("#ov").addEventListener("keydown", e => { if (e.key === "Enter" && F && e.target.tagName === "INPUT") { const s = $("#sheet .save:not(:disabled)"); if (s) { e.preventDefault(); s.click(); } } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#ov").classList.contains("open")) closeSheet(); });

render();
})();
</script>
</body>
</html>
